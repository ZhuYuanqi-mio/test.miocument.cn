<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>我的 - 咯咯哒生态农场</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<script>
var urlMemberId = new URLSearchParams(location.search).get('member_id');
var qs = urlMemberId ? '?member_id='+encodeURIComponent(urlMemberId) : '';
</script>

<!-- 个人信息 -->
<div class="panel">
  <div style="padding:20px 16px;">
    <div class="profile-row">
      <div class="profile-avatar" id="avatarChar">-</div>
      <div>
        <div class="profile-name" id="profileName">加载中...</div>
        <div class="profile-phone" id="profilePhone"></div>
      </div>
    </div>
  </div>
</div>

<!-- 服务概览 -->
<div class="panel" style="margin-top:10px;">
  <div style="padding:14px 16px;display:flex;justify-content:space-between;align-items:center;">
    <span style="font-size:15px;font-weight:600;color:var(--text-1);">我的配送服务</span>
    <span class="tag tag-green" id="myStatusTag">加载中</span>
  </div>
  <div style="border-top:1px solid #f0f0f0;">
    <div class="stat-row">
      <div class="stat-item">
        <div class="stat-num" id="myTotal">-</div>
        <div class="stat-label" id="myTotalLabel">总次数</div>
      </div>
      <div class="stat-item">
        <div class="stat-num text-green" id="myDone">-</div>
        <div class="stat-label" id="myDoneLabel">已配送</div>
      </div>
      <div class="stat-item">
        <div class="stat-num" id="myRemain">-</div>
        <div class="stat-label" id="myRemainLabel">剩余</div>
      </div>
    </div>
  </div>
  <div style="padding:0 16px 14px;">
    <a id="linkService" href="/service/" class="btn btn-primary btn-block" style="text-decoration:none;">查看配送详情</a>
  </div>
</div>

<!-- 续费提醒 -->
<div id="renewNotice" style="display:none;margin-top:10px;background:#FFF8E1;padding:14px 16px;display:flex;align-items:center;gap:10px;">
  <div style="width:36px;height:36px;border-radius:50%;background:#FFE082;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px;">!</div>
  <div style="flex:1;min-width:0;">
    <div style="font-size:14px;font-weight:600;color:#8B6914;">续费提醒</div>
    <div style="font-size:12px;color:#A68B2D;margin-top:2px;">您的配送服务剩余 <b style="color:#E6A700;" id="renewCount">-</b>，建议提前续费以确保服务不中断</div>
  </div>
</div>

<!-- 菜单 -->
<div class="panel" style="margin-top:10px;">
  <a class="cell" id="linkService2" href="/service/">
    <div class="cell-body"><span class="cell-label">配送服务管理</span></div>
    <span class="cell-value" id="menuNextInfo">-</span>
    <span class="cell-arrow"></span>
  </a>
  <a class="cell" href="/records/">
    <div class="cell-body"><span class="cell-label">配送记录</span></div>
    <span class="cell-value" id="menuRecordCount">-</span>
    <span class="cell-arrow"></span>
  </a>
</div>

<div class="panel" style="margin-top:10px;">
  <div class="cell" onclick="openAddrPage()" style="cursor:pointer;">
    <div class="cell-body"><span class="cell-label">收货地址</span></div>
    <span class="cell-value" id="addrSummary">-</span>
    <span class="cell-arrow"></span>
  </div>
  <div class="cell">
    <div class="cell-body"><span class="cell-label">联系客服</span></div>
    <span class="cell-arrow"></span>
  </div>
  <div class="cell">
    <div class="cell-body"><span class="cell-label">关于我们</span></div>
    <span class="cell-arrow"></span>
  </div>
</div>

<!-- 地址管理页 -->
<div class="addr-page" id="addrPage">
  <div class="header">
    <button class="back" onclick="closeAddrPage()">&lt;</button>
    <span class="title">我的地址</span>
    <button class="add-btn" onclick="openAddrForm(-1)">+</button>
  </div>
  <div class="addr-list" id="addrList"></div>
  <div style="padding:12px 16px;background:var(--bg);flex-shrink:0;">
    <button class="btn btn-primary btn-block" onclick="openAddrForm(-1)">新增收货地址</button>
  </div>
</div>

<!-- 添加/编辑地址弹窗 -->
<div class="overlay" id="addrFormModal">
  <div class="sheet" style="max-height:70vh;">
    <div class="sheet-head">
      <span class="sheet-title" id="addrFormTitle">新增地址</span>
      <button class="close" onclick="closeAddrForm()">X</button>
    </div>
    <div class="sheet-body">
      <div class="addr-form-group">
        <label>收货人</label>
        <input type="text" id="af-name" placeholder="请输入收货人姓名">
      </div>
      <div class="addr-form-group">
        <label>手机号码</label>
        <input type="tel" id="af-phone" placeholder="请输入手机号码">
      </div>
      <div class="addr-form-group">
        <label>所在地区</label>
        <input type="text" id="af-region" placeholder="如：北京市东城区">
      </div>
      <div class="addr-form-group">
        <label>详细地址</label>
        <textarea id="af-detail" placeholder="街道、楼牌号等"></textarea>
      </div>
      <div style="display:flex;align-items:center;gap:8px;margin-top:4px;">
        <input type="checkbox" id="af-default" style="width:18px;height:18px;accent-color:var(--green);">
        <label for="af-default" style="font-size:14px;color:var(--text-1);margin:0;">设为默认地址</label>
      </div>
    </div>
    <div class="sheet-foot">
      <button class="btn btn-primary btn-block" onclick="saveAddr()">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div style="height:70px;"></div>

<!-- 底部导航 -->
<div class="tab-bar">
  <a class="tab-item" href="/service/">
    <span class="tab-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    </span>
    <span>首页</span>
  </a>
  <a class="tab-item active" href="/my/">
    <span class="tab-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </span>
    <span>我的</span>
  </a>
</div>

<!-- member_id 模式：给所有导航链接带上参数 -->
<script>
if(qs){
  document.querySelectorAll('.tab-bar a, a[href="/service/"], a[href="/my/"], a[href="/records/"]').forEach(function(a){
    var h=a.getAttribute('href');
    if(h && h.indexOf('member_id')<0) a.setAttribute('href', h+qs);
  });
}
</script>

<script>
var ZION_LIST = 'https://zion-app.functorz.com/zero/mwLZrNj8qJA/callback/20ac40dd-0181-43c8-beaf-6e4c9636b3ed';

var addresses = [];
var nextId = 1;
var editingIdx = -1;

async function callZionPost(url, data){
  var res = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data)});
  return await res.json();
}

async function loadMyData(){
  try{
    var res = await callZionPost(ZION_LIST, {});
    var list = JSON.parse(res.orders_data || '[]');

    if(urlMemberId){
      var mid = Number(urlMemberId);
      list = list.filter(function(o){ return o.member_id === mid; });
    }

    if(!list.length){
      if(urlMemberId){
        location.replace('/service/' + qs);
        return;
      }
      document.getElementById('profileName').textContent = '暂无数据';
      document.getElementById('myStatusTag').textContent = '无订单';
      document.getElementById('myStatusTag').className = 'tag tag-gray';
      return;
    }

    var first = list[0];
    var memberName = (first.member && first.member.wechat_name) || first.wechat_name || '未知';
    var memberPhone = (first.member && first.member.phone) || first.phone || '';

    document.getElementById('avatarChar').textContent = memberName.charAt(0);
    document.getElementById('profileName').textContent = memberName;
    document.getElementById('profilePhone').textContent = memberPhone ? memberPhone.replace(/(\d{3})\d{4}(\d{4})/, '$1****$2') : '';

    var totalOrders = list.length;
    var totalCount = 0;
    var totalDone = 0;
    list.forEach(function(o){
      var tc = o.total_count || 0;
      var drs = o.delivery_records || [];
      var dc = drs.filter(function(r){ return r.status === 'done'; }).length;
      totalCount += tc;
      totalDone += dc;
    });
    var totalRemain = totalCount - totalDone;

    document.getElementById('myTotal').textContent = totalCount;
    document.getElementById('myDone').textContent = totalDone;
    document.getElementById('myRemain').textContent = totalRemain;
    document.getElementById('myStatusTag').textContent = '正常配送中';
    document.getElementById('myStatusTag').className = 'tag tag-green';

    document.getElementById('menuNextInfo').textContent = '共' + totalOrders + '个订单';
    document.getElementById('menuRecordCount').textContent = '共' + totalDone + '条';

    if(totalRemain > 0 && totalRemain <= totalCount * 0.3){
      document.getElementById('renewNotice').style.display = 'flex';
      document.getElementById('renewCount').textContent = totalRemain + '次';
    }

  }catch(e){
    console.error('loadMyData:', e);
    document.getElementById('profileName').textContent = '加载失败';
  }
}

loadMyData();

function openAddrPage(){
  renderAddrList();
  document.getElementById('addrPage').classList.add('show');
}
function closeAddrPage(){ document.getElementById('addrPage').classList.remove('show'); updateSummary(); }

function updateSummary(){
  document.getElementById('addrSummary').textContent = addresses.length ? addresses.length + '个地址' : '暂无';
}
updateSummary();

function renderAddrList(){
  var c = document.getElementById('addrList');
  if(!addresses.length){ c.innerHTML = '<div class="addr-empty">暂无收货地址</div>'; return; }
  var h = '';
  for(var i = 0; i < addresses.length; i++){
    var a = addresses[i];
    h += '<div class="addr-card">';
    h += '<div class="addr-region">' + a.region + '</div>';
    h += '<div class="addr-detail">' + a.detail + '</div>';
    h += '<div class="addr-contact"><span>' + a.name + '</span><span>' + a.phone + '</span>';
    if(a.isDefault) h += '<span class="addr-tag-default">默认</span>';
    h += '</div>';
    h += '<div class="addr-ops">';
    if(!a.isDefault) h += '<span class="addr-op addr-op-default" onclick="setDefault(' + i + ')">设为默认</span>';
    else h += '<span class="addr-op addr-op-default" style="color:var(--green);font-weight:500;">当前默认</span>';
    h += '<span class="addr-op" onclick="openAddrForm(' + i + ')">编辑</span>';
    h += '<span class="addr-op addr-op-del" onclick="delAddr(' + i + ')">删除</span>';
    h += '</div></div>';
  }
  c.innerHTML = h;
}

function setDefault(idx){
  for(var i = 0; i < addresses.length; i++) addresses[i].isDefault = false;
  addresses[idx].isDefault = true;
  renderAddrList();
  showToast('已设为默认地址');
}

function delAddr(idx){
  if(!confirm('确定删除该地址？')) return;
  addresses.splice(idx, 1);
  renderAddrList();
  showToast('已删除');
}

function openAddrForm(idx){
  editingIdx = idx;
  var title = idx < 0 ? '新增地址' : '编辑地址';
  document.getElementById('addrFormTitle').textContent = title;
  if(idx >= 0){
    var a = addresses[idx];
    document.getElementById('af-name').value = a.name;
    document.getElementById('af-phone').value = a.phone;
    document.getElementById('af-region').value = a.region;
    document.getElementById('af-detail').value = a.detail;
    document.getElementById('af-default').checked = a.isDefault;
  } else {
    document.getElementById('af-name').value = '';
    document.getElementById('af-phone').value = '';
    document.getElementById('af-region').value = '';
    document.getElementById('af-detail').value = '';
    document.getElementById('af-default').checked = false;
  }
  document.getElementById('addrFormModal').classList.add('show');
}
function closeAddrForm(){ document.getElementById('addrFormModal').classList.remove('show'); }

function saveAddr(){
  var name = document.getElementById('af-name').value.trim();
  var phone = document.getElementById('af-phone').value.trim();
  var region = document.getElementById('af-region').value.trim();
  var detail = document.getElementById('af-detail').value.trim();
  var isDef = document.getElementById('af-default').checked;
  if(!name || !phone || !region || !detail){ showToast('请填写完整信息'); return; }
  if(isDef) for(var i = 0; i < addresses.length; i++) addresses[i].isDefault = false;
  if(editingIdx >= 0){
    addresses[editingIdx].name = name;
    addresses[editingIdx].phone = phone;
    addresses[editingIdx].region = region;
    addresses[editingIdx].detail = detail;
    addresses[editingIdx].isDefault = isDef;
  } else {
    addresses.push({ id: nextId++, name: name, phone: phone, region: region, detail: detail, isDefault: isDef });
  }
  closeAddrForm();
  renderAddrList();
  showToast(editingIdx >= 0 ? '已保存' : '添加成功');
}

function showToast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.remove('show');
  void t.offsetWidth;
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2000);
}

document.querySelectorAll('.overlay').forEach(function(m){
  m.addEventListener('click', function(e){ if(e.target === this) this.classList.remove('show'); });
});
</script>
</body>
</html>
