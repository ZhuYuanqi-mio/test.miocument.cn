<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>配送提醒 - 咯咯哒生态农场</title>
<link rel="stylesheet" href="/css/style.css">
<style>
.dc-page { padding: 0 0 calc(20px + var(--safe-bottom)); }
.dc-header {
  text-align: center; padding: 32px 16px 24px;
  background: #fff;
  border-bottom: 1px solid var(--border);
}
.dc-icon { font-size: 48px; margin-bottom: 12px; }
.dc-title { font-size: 20px; font-weight: 700; color: var(--text-1); }
.dc-subtitle { font-size: 14px; color: var(--text-2); margin-top: 6px; }

.dc-card {
  background: #fff; margin: 12px 16px; border-radius: 12px;
  border: 1px solid var(--border); overflow: hidden;
}
.dc-card-title {
  font-size: 14px; font-weight: 600; color: var(--text-2);
  padding: 14px 16px 0; text-transform: uppercase; letter-spacing: 1px;
}
.dc-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 16px; border-bottom: 1px solid #f5f5f5;
}
.dc-row:last-child { border-bottom: none; }
.dc-label { font-size: 14px; color: var(--text-2); flex-shrink: 0; }
.dc-value { font-size: 14px; font-weight: 600; color: var(--text-1); text-align: right; max-width: 60%; }

.dc-actions { padding: 24px 16px; }
.dc-btn {
  display: block; width: 100%; padding: 14px; border-radius: 10px;
  font-size: 16px; font-weight: 600; text-align: center;
  border: none; cursor: pointer; transition: opacity .2s;
}
.dc-btn:active { opacity: .7; }
.dc-btn-cancel { background: var(--red); color: #fff; }
.dc-btn-restore { background: var(--green); color: #fff; }
.dc-btn-disabled { background: #e0e0e0; color: #999; pointer-events: none; }
.dc-btn + .dc-btn { margin-top: 12px; }
.dc-btn-outline {
  background: #fff; color: var(--text-2);
  border: 1px solid var(--border);
}

.dc-status {
  text-align: center; padding: 40px 16px;
  font-size: 15px; color: var(--text-2);
}
.dc-status-icon { font-size: 48px; margin-bottom: 12px; }

.dc-toast {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
  background: rgba(0,0,0,.75); color: #fff; padding: 12px 24px;
  border-radius: 8px; font-size: 14px; z-index: 999;
  transition: opacity .3s; pointer-events: none;
}

.dc-addr-card {
  background: #fff; margin: 0 16px 12px; border-radius: 12px;
  border: 1px solid var(--border); overflow: hidden;
}
.dc-addr-head {
  display: flex; justify-content: space-between; align-items: center;
  padding: 14px 16px 0;
}
.dc-addr-head .dc-card-title { padding: 0; }
.dc-addr-edit-link {
  font-size: 13px; color: var(--green); cursor: pointer; font-weight: 500;
}
.dc-addr-body { padding: 10px 16px 14px; }
.dc-addr-name { font-size: 15px; font-weight: 600; color: var(--text-1); }
.dc-addr-detail { font-size: 13px; color: var(--text-2); margin-top: 4px; line-height: 1.5; }
.dc-addr-empty { font-size: 13px; color: var(--text-3); padding: 10px 16px 14px; }

.dc-addr-form { padding: 0 16px 14px; display: none; }
.dc-addr-form.show { display: block; }
.dc-addr-form .fg { margin-bottom: 10px; }
.dc-addr-form .fg label { display: block; font-size: 12px; color: var(--text-2); margin-bottom: 4px; }
.dc-addr-form .fg input,
.dc-addr-form .fg textarea {
  width: 100%; border: 1px solid var(--border); border-radius: 6px;
  padding: 8px 10px; font-size: 14px; color: var(--text-1);
  background: #fafafa; box-sizing: border-box;
}
.dc-addr-form .fg textarea { resize: none; height: 60px; }
.dc-addr-form .dc-addr-btns { display: flex; gap: 10px; margin-top: 12px; }
.dc-addr-form .dc-addr-btns button {
  flex: 1; padding: 10px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer;
}
.dc-addr-save { background: var(--green); color: #fff; border: none; }
.dc-addr-cancel-btn { background: #fff; color: var(--text-2); border: 1px solid var(--border); }
</style>
</head>
<body>
<div class="dc-page" id="page">
  <div style="text-align:center;padding:60px 0;color:var(--text-3);">加载中...</div>
</div>

<script>
var WEEKDAY_NAMES = ['','周一','周二','周三','周四','周五','周六','周日'];

var params = new URLSearchParams(location.search);
var orderId = params.get('order_id');
var deliveryDate = params.get('date');
var memberId = params.get('member_id');

var SKIP_URL = 'https://zion-app.functorz.com/zero/mwLZrNj8qJA/callback/a9835e25-19ca-40a8-b50c-23ddd96c062b';
var CANCEL_SKIP_URL = 'https://zion-app.functorz.com/zero/mwLZrNj8qJA/callback/24a53644-43b8-46f7-951e-4369f4e7ea37';
var GET_ORDER_URL = 'https://zion-app.functorz.com/zero/mwLZrNj8qJA/callback/2df7e8d5-8990-469d-b589-f0080d5e0068';
var UPSERT_ADDR_URL = 'https://zion-app.functorz.com/zero/mwLZrNj8qJA/callback/d8e994c3-bd3b-4453-b676-a2ea483a9f1c';

var currentOrder = null;
var currentAddr = null;

function callZion(url, data) {
  return fetch(url, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(data)
  }).then(function(r){ return r.json(); });
}

function showToast(msg) {
  var t = document.createElement('div');
  t.className = 'dc-toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function(){ t.style.opacity = '0'; }, 1500);
  setTimeout(function(){ t.remove(); }, 2000);
}

function isBeforeDate(dateStr) {
  var now = new Date(Date.now() + 8 * 3600000);
  var todayStr = now.toISOString().slice(0, 10);
  return todayStr < dateStr;
}

function formatDate(dateStr) {
  if (!dateStr) return '';
  var parts = dateStr.split('-');
  return parts[0] + '年' + parseInt(parts[1]) + '月' + parseInt(parts[2]) + '日';
}

function getWeekdayFromDate(dateStr) {
  var d = new Date(dateStr + 'T00:00:00+08:00');
  var wd = d.getDay();
  return wd === 0 ? 7 : wd;
}

function init() {
  if (!orderId || !deliveryDate) {
    document.getElementById('page').innerHTML =
      '<div class="dc-status"><div class="dc-status-icon">&#x26A0;&#xFE0F;</div>参数缺失，请从通知消息中进入</div>';
    return;
  }

  callZion(GET_ORDER_URL, { order_id: Number(orderId) }).then(function(res) {
    var order = typeof res.order_data === 'string' ? JSON.parse(res.order_data) : res.order_data;
    if (!order) {
      document.getElementById('page').innerHTML =
        '<div class="dc-status"><div class="dc-status-icon">&#x26A0;&#xFE0F;</div>未找到该订单</div>';
      return;
    }
    currentOrder = order;
    extractAddress(order);
    render(order);
  }).catch(function(e) {
    document.getElementById('page').innerHTML =
      '<div class="dc-status"><div class="dc-status-icon">&#x26A0;&#xFE0F;</div>加载失败: ' + e.message + '</div>';
  });
}

function extractAddress(order) {
  currentAddr = null;
  if (order.member && order.member.addresses && order.member.addresses.length) {
    var addrs = order.member.addresses;
    for (var i = 0; i < addrs.length; i++) {
      if (addrs[i].is_default) { currentAddr = addrs[i]; break; }
    }
    if (!currentAddr) currentAddr = addrs[0];
  }
}

function render(order) {
  var product = order.category || order.ud_product_name_d340d0 || order.product_name || '商品';
  var memberName = (order.member && order.member.wechat_name) || '会员';
  var wd = getWeekdayFromDate(deliveryDate);
  var canCancel = isBeforeDate(deliveryDate);

  var skips = order.delivery_skips || [];
  var isSkipped = skips.some(function(s){ return s.skip_date === deliveryDate; });

  var doneCount = 0;
  if (order.delivery_records) {
    order.delivery_records.forEach(function(r){ if(r.status === 'done') doneCount++; });
  }
  var remaining = (order.total_count || 0) - doneCount;

  var html = '';
  html += '<div class="dc-header">';
  if (isSkipped) {
    html += '<div class="dc-icon">&#x1F6AB;</div>';
    html += '<div class="dc-title">已取消本次配送</div>';
    html += '<div class="dc-subtitle">' + formatDate(deliveryDate) + ' ' + WEEKDAY_NAMES[wd] + ' 的配送已取消</div>';
  } else {
    html += '<div class="dc-icon">&#x1F69A;</div>';
    html += '<div class="dc-title">明日配送提醒</div>';
    html += '<div class="dc-subtitle">' + formatDate(deliveryDate) + ' ' + WEEKDAY_NAMES[wd] + '</div>';
  }
  html += '</div>';

  html += '<div class="dc-card">';
  html += '<div class="dc-card-title">配送信息</div>';
  html += '<div class="dc-row"><span class="dc-label">商品</span><span class="dc-value">' + escHtml(product.length > 15 ? product.slice(0,15) + '...' : product) + '</span></div>';
  html += '<div class="dc-row"><span class="dc-label">会员</span><span class="dc-value">' + escHtml(memberName) + '</span></div>';
  html += '<div class="dc-row"><span class="dc-label">配送日期</span><span class="dc-value">' + formatDate(deliveryDate) + ' ' + WEEKDAY_NAMES[wd] + '</span></div>';
  html += '<div class="dc-row"><span class="dc-label">剩余次数</span><span class="dc-value">' + remaining + ' / ' + (order.total_count || 0) + ' ' + (order.total_unit || '次') + '</span></div>';
  html += '<div class="dc-row"><span class="dc-label">配送方式</span><span class="dc-value">' + escHtml(order.delivery_method || '快递发货') + '</span></div>';
  html += '</div>';

  html += '<div class="dc-addr-card">';
  html += '<div class="dc-addr-head"><span class="dc-card-title">配送地址</span>';
  if (canCancel && !isSkipped) {
    html += '<span class="dc-addr-edit-link" onclick="toggleAddrForm()">' + (currentAddr ? '修改' : '添加') + '</span>';
  }
  html += '</div>';
  if (currentAddr) {
    html += '<div class="dc-addr-body" id="addrDisplay">';
    html += '<div class="dc-addr-name">' + escHtml(currentAddr.name || '') + '  ' + escHtml(currentAddr.phone || '') + '</div>';
    html += '<div class="dc-addr-detail">' + escHtml((currentAddr.region || '') + ' ' + (currentAddr.detail || '')) + '</div>';
    html += '</div>';
  } else {
    html += '<div class="dc-addr-empty" id="addrDisplay">暂无配送地址，请添加</div>';
  }
  html += '<div class="dc-addr-form" id="addrForm">';
  html += '<div class="fg"><label>收货人</label><input type="text" id="af-name" placeholder="姓名" value="' + escAttr(currentAddr ? currentAddr.name || '' : '') + '"></div>';
  html += '<div class="fg"><label>手机号码</label><input type="tel" id="af-phone" placeholder="手机号" value="' + escAttr(currentAddr ? currentAddr.phone || '' : '') + '"></div>';
  html += '<div class="fg"><label>所在地区</label><input type="text" id="af-region" placeholder="如：杭州市余杭区" value="' + escAttr(currentAddr ? currentAddr.region || '' : '') + '"></div>';
  html += '<div class="fg"><label>详细地址</label><textarea id="af-detail" placeholder="街道、楼牌号等">' + escHtml(currentAddr ? currentAddr.detail || '' : '') + '</textarea></div>';
  html += '<div class="dc-addr-btns"><button class="dc-addr-cancel-btn" onclick="hideAddrForm()">取消</button><button class="dc-addr-save" onclick="saveAddress()">保存地址</button></div>';
  html += '</div>';
  html += '</div>';

  html += '<div class="dc-actions">';
  if (isSkipped) {
    if (canCancel) {
      html += '<button class="dc-btn dc-btn-restore" onclick="restoreDelivery()">恢复本次配送</button>';
    } else {
      html += '<button class="dc-btn dc-btn-disabled">配送日已过，无法操作</button>';
    }
  } else {
    if (canCancel) {
      html += '<button class="dc-btn dc-btn-cancel" onclick="skipDelivery()">取消本次配送</button>';
      html += '<div style="text-align:center;margin-top:10px;font-size:12px;color:var(--text-3);">取消后本次不配送、不扣次数，下次正常配送</div>';
    } else {
      html += '<button class="dc-btn dc-btn-disabled">配送日已到，无法取消</button>';
    }
  }
  if (memberId) {
    html += '<button class="dc-btn dc-btn-outline" onclick="location.href=\'/service/?member_id=' + memberId + '\'">返回首页</button>';
  }
  html += '</div>';

  document.getElementById('page').innerHTML = html;
}

function escHtml(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
function escAttr(s) {
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function toggleAddrForm() {
  var f = document.getElementById('addrForm');
  if (f) f.classList.toggle('show');
}
function hideAddrForm() {
  var f = document.getElementById('addrForm');
  if (f) f.classList.remove('show');
}

function saveAddress() {
  var name = document.getElementById('af-name').value.trim();
  var phone = document.getElementById('af-phone').value.trim();
  var region = document.getElementById('af-region').value.trim();
  var detail = document.getElementById('af-detail').value.trim();
  if (!name || !phone || !detail) { showToast('请填写收货人、手机号和详细地址'); return; }

  var mid = currentOrder && currentOrder.member_id;
  if (!mid && memberId) mid = Number(memberId);
  if (!mid) { showToast('无法确定会员ID'); return; }

  if (!UPSERT_ADDR_URL) {
    showToast('地址保存功能配置中');
    return;
  }

  var addrId = currentAddr ? currentAddr.id : null;
  var payload = {
    member_id: mid,
    addr_json: JSON.stringify({
      id: addrId,
      name: name,
      phone: phone,
      region: region,
      detail: detail,
      is_default: true
    })
  };

  var btn = document.querySelector('.dc-addr-save');
  if (btn) { btn.textContent = '保存中...'; btn.disabled = true; }

  callZion(UPSERT_ADDR_URL, payload).then(function(res) {
    if (res.result === 'ok' || res.addr_id) {
      showToast('地址已保存');
      currentAddr = { id: res.addr_id || addrId, name: name, phone: phone, region: region, detail: detail, is_default: true };
      hideAddrForm();
      var disp = document.getElementById('addrDisplay');
      if (disp) {
        disp.className = 'dc-addr-body';
        disp.innerHTML = '<div class="dc-addr-name">' + escHtml(name) + '  ' + escHtml(phone) + '</div>'
          + '<div class="dc-addr-detail">' + escHtml(region + ' ' + detail) + '</div>';
      }
    } else {
      showToast('保存失败: ' + (res.result || '未知错误'));
    }
  }).catch(function(e) {
    showToast('保存失败: ' + e.message);
  }).finally(function() {
    if (btn) { btn.textContent = '保存地址'; btn.disabled = false; }
  });
}

function skipDelivery() {
  var btn = document.querySelector('.dc-btn-cancel');
  if (btn) { btn.textContent = '处理中...'; btn.classList.add('dc-btn-disabled'); }

  callZion(SKIP_URL, { order_id: Number(orderId), skip_date: deliveryDate }).then(function() {
    showToast('已取消本次配送');
    setTimeout(init, 800);
  }).catch(function(e) {
    showToast('操作失败: ' + e.message);
    if (btn) { btn.textContent = '取消本次配送'; btn.classList.remove('dc-btn-disabled'); }
  });
}

function restoreDelivery() {
  var btn = document.querySelector('.dc-btn-restore');
  if (btn) { btn.textContent = '处理中...'; btn.classList.add('dc-btn-disabled'); }

  callZion(CANCEL_SKIP_URL, { order_id: Number(orderId), skip_date: deliveryDate }).then(function() {
    showToast('已恢复配送');
    setTimeout(init, 800);
  }).catch(function(e) {
    showToast('操作失败: ' + e.message);
    if (btn) { btn.textContent = '恢复本次配送'; btn.classList.remove('dc-btn-disabled'); }
  });
}

init();
</script>
</body>
</html>
