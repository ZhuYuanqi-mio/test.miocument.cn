<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>查看结果</title>
<script src="https://gosspublic.alicdn.com/aliyun-oss-sdk-6.18.0.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif;background:#f7f7f7;color:#222;min-height:100vh;-webkit-font-smoothing:antialiased}

.top-bar{position:sticky;top:0;z-index:50;background:#ececec;padding:14px 16px;display:flex;align-items:center;justify-content:space-between}
.top-bar h1{font-size:16px;font-weight:600;color:#222;flex:1;text-align:center;margin:0}
.top-bar .tb-logo{width:32px;height:32px;border-radius:50%;object-fit:cover;flex-shrink:0}
.tb-chat-wrap{position:relative;flex-shrink:0;cursor:pointer}
.tb-chat-wrap:active{opacity:.6}
.tb-chat-wrap svg{width:26px;height:26px;display:block}
.tb-chat-badge{display:none;position:absolute;top:-5px;right:-7px;min-width:16px;height:16px;border-radius:8px;background:#e33;color:#fff;font-size:10px;line-height:16px;text-align:center;padding:0 4px;font-weight:600}

.container{padding:16px}
.empty-msg{text-align:center;padding:60px 0;color:#aaa;font-size:14px}

.result-card{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px;border:1px solid #e8e8e8}
.rc-title{font-size:15px;font-weight:600;color:#222;margin-bottom:10px}
.rc-desc{font-size:13px;color:#666;margin-bottom:12px;line-height:1.5}
.rc-files{margin-bottom:10px}
.rc-file{display:flex;align-items:center;padding:10px 12px;background:#fafafa;border-radius:6px;margin-bottom:6px;cursor:pointer;border:1px solid #e8e8e8}
.rc-file:active{background:#f0f0f0}
.rc-file-ico{width:28px;height:28px;margin-right:10px;flex-shrink:0}
.rc-file-name{font-size:13px;color:#222;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.status-tag{display:inline-block;padding:4px 10px;border-radius:4px;font-size:12px;font-weight:500}
.st-pending{background:#fff3e0;color:#e65100}
.st-done{background:#e8f5e9;color:#2e7d32}

.bottom-bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #eee;padding:10px 16px;z-index:50}
.bottom-bar .inner{display:flex;gap:8px}
.bottom-bar button{flex:1;padding:12px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}
.bottom-bar .btn-primary{background:#222;color:#fff}
.bottom-bar .btn-primary:active{opacity:.75}
.bottom-bar .btn-secondary{background:#f2f2f2;color:#222}
.bottom-bar .btn-secondary:active{background:#e8e8e8}

/* ===== Chat Overlay ===== */
.chat-ov{display:none;position:fixed;inset:0;background:#f7f7f7;z-index:250;flex-direction:column}
.chat-ov.show{display:flex}
.chat-ov-head{background:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e0e0e0;flex-shrink:0}
.chat-ov-head .bk{font-size:13px;color:#222;cursor:pointer;min-width:44px}
.chat-ov-head h2{font-size:15px;font-weight:600;flex:1;text-align:center;color:#222}
.chat-ov-head .sync-btn{padding:5px 12px;border-radius:6px;border:1px solid #ddd;background:#fff;color:#222;font-size:12px;cursor:pointer}
.chat-ov-head .sync-btn:active{background:#f2f2f2}
.chat-ov-msgs{flex:1;overflow-y:auto;padding:12px 16px;-webkit-overflow-scrolling:touch}
.chat-ov-msgs .chat-empty{text-align:center;padding:60px 0;color:#aaa;font-size:14px}
.msg-row{display:flex;margin-bottom:14px}
.msg-row.me{flex-direction:row-reverse}
.msg-bubble{max-width:75%;padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.5;word-break:break-word}
.msg-row:not(.me) .msg-bubble{background:#fff;color:#222;border:1px solid #e8e8e8}
.msg-row.me .msg-bubble{background:#222;color:#fff}
.msg-bubble img{max-width:180px;border-radius:8px;cursor:pointer;display:block;margin:4px 0}
.msg-time{text-align:center;font-size:11px;color:#bbb;margin:10px 0}
.chat-ov-input{background:#fff;border-top:1px solid #e0e0e0;padding:8px 12px;display:flex;align-items:flex-end;gap:8px;flex-shrink:0}
.chat-ov-input .ci-actions{display:flex;gap:4px;flex-shrink:0;padding-bottom:4px}
.chat-ov-input .ci-btn{width:32px;height:32px;border-radius:50%;border:1px solid #ddd;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#666}
.chat-ov-input .ci-btn:active{background:#f0f0f0}
.chat-ov-input .ci-btn svg{width:16px;height:16px}
.chat-ov-input textarea{flex:1;border:1px solid #ddd;border-radius:8px;padding:8px 10px;font-size:14px;resize:none;outline:none;max-height:100px;min-height:36px;font-family:inherit;line-height:1.4;background:#fafafa}
.chat-ov-input textarea:focus{border-color:#555}
.chat-ov-input .send-btn{padding:8px 16px;border:none;border-radius:8px;background:#222;color:#fff;font-size:13px;font-weight:600;cursor:pointer;flex-shrink:0;align-self:flex-end}
.chat-ov-input .send-btn:active{opacity:.7}

/* ===== After-sale Form Overlay ===== */
.as-ov{display:none;position:fixed;inset:0;background:#f7f7f7;z-index:200;flex-direction:column}
.as-ov.show{display:flex}
.as-ov-head{background:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e0e0e0;flex-shrink:0}
.as-ov-head .bk{font-size:13px;color:#222;cursor:pointer}
.as-ov-head h2{font-size:15px;font-weight:600;flex:1;text-align:center;color:#222}
.as-ov-body{flex:1;overflow-y:auto;padding:16px}
.as-group{margin-bottom:16px}
.as-group label{display:block;font-size:13px;font-weight:500;color:#333;margin-bottom:6px}
.as-group textarea,.as-group input{width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px;outline:none;font-family:inherit;background:#fff}
.as-group textarea{min-height:80px;resize:vertical}
.as-group textarea:focus,.as-group input:focus{border-color:#555}
.as-upload-area{border:1px dashed #ccc;border-radius:8px;padding:16px;text-align:center;cursor:pointer;background:#fafafa}
.as-upload-area:active{background:#f0f0f0}
.as-file-list{margin-top:8px}
.as-file-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f0f0f0;font-size:13px}
.as-file-row .rm{color:#c00;cursor:pointer;font-size:12px}
.as-bar{background:#fff;border-top:1px solid #eee;padding:10px 16px;flex-shrink:0}
.as-bar button{width:100%;padding:12px;border:none;border-radius:8px;background:#222;color:#fff;font-size:14px;font-weight:600;cursor:pointer}
.as-bar button:active{opacity:.75}

/* ===== Misc ===== */
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(34,34,34,.9);color:#fff;padding:12px 24px;border-radius:8px;font-size:14px;z-index:9999;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
.viewer{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:300;justify-content:center;align-items:center;cursor:pointer}
.viewer.show{display:flex}
.viewer img{max-width:95%;max-height:90vh;border-radius:4px}
</style>
</head>
<body>

<div class="top-bar">
  <img class="tb-logo" src="https://my-video-storage-shihuang.oss-cn-wuhan-lr.aliyuncs.com/xianyu/logo.jpg" alt="">
  <h1 id="pageTitle">查看结果</h1>
  <div class="tb-chat-wrap" onclick="openChat()">
    <svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg"><path d="M817.71875 844.15625c106.3125-78.75 174-197.71875 174-330.75 0-237.09375-214.875-429.375-479.8125-429.375C246.875 84.03125 32 276.21875 32 513.3125c0 231.9375 205.6875 420.375 462.65625 428.53125 0.9375 0.375 1.875 0.65625 3 0.65625H510.125c0.5625 0 1.125 0.09375 1.6875 0.09375s1.125-0.09375 1.6875-0.09375h419.71875c9 0 12.5625-11.625 5.15625-16.6875l-120.65625-81.65625z" fill="#222"/><path d="M376.90625 513.3125m-64.40625 0a64.40625 64.40625 0 1 0 128.8125 0 64.40625 64.40625 0 1 0-128.8125 0Z" fill="#FFFFFF"/><path d="M686.375 513.3125m-64.40625 0a64.40625 64.40625 0 1 0 128.8125 0 64.40625 64.40625 0 1 0-128.8125 0Z" fill="#FFFFFF"/></svg>
    <span class="tb-chat-badge" id="chatBadge"></span>
  </div>
</div>

<div class="container" id="mainContent">
  <div class="empty-msg" id="loadingMsg">加载中...</div>
</div>

<div class="bottom-bar">
  <div class="inner">
    <button class="btn-secondary" onclick="openChat()">联系客服</button>
    <button class="btn-primary" onclick="openAfterSale()">提交售后需求</button>
  </div>
</div>

<!-- ===== Chat Overlay ===== -->
<div class="chat-ov" id="chatOv">
  <div class="chat-ov-head">
    <span class="bk" onclick="closeChat()">< 返回</span>
    <h2>消息</h2>
    <button class="sync-btn" onclick="loadChatMsgs()">同步消息</button>
  </div>
  <div class="chat-ov-msgs" id="chatOvMsgs">
    <div class="chat-empty">暂无消息，可在这里和客服沟通</div>
  </div>
  <div class="chat-ov-input">
    <div class="ci-actions">
      <label class="ci-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg><input type="file" accept="image/*" style="display:none" onchange="sendImg(this)"></label>
      <label class="ci-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg><input type="file" style="display:none" onchange="sendFile(this)"></label>
    </div>
    <textarea id="chatInput" rows="1" placeholder="输入消息..." oninput="autoGrow(this)" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendText();}"></textarea>
    <button class="send-btn" onclick="sendText()">发送</button>
  </div>
</div>

<!-- ===== After-sale Form Overlay ===== -->
<div class="as-ov" id="asOv">
  <div class="as-ov-head">
    <span class="bk" onclick="closeAfterSale()">< 返回</span>
    <h2>提交售后需求</h2>
    <span style="min-width:44px"></span>
  </div>
  <div class="as-ov-body">
    <div class="as-group">
      <label>售后针对的结果文件 <span style="color:#c00">*</span></label>
      <div id="asFileSelect"></div>
    </div>
    <div class="as-group">
      <label>修改要求 <span style="color:#c00">*</span></label>
      <textarea id="asDesc" placeholder="描述你需要修改的内容"></textarea>
    </div>
    <div class="as-group">
      <label>补充文件（选填）</label>
      <div class="as-upload-area" onclick="document.getElementById('asFileInput').click()">
        <div style="font-size:13px;color:#888">点击选择文件</div>
      </div>
      <input type="file" id="asFileInput" multiple style="display:none" onchange="handleAsFiles(this)">
      <div class="as-file-list" id="asFileList"></div>
    </div>
  </div>
  <div class="as-bar">
    <button id="asSubmitBtn" onclick="submitAfterSale()">提交售后</button>
  </div>
</div>

<div class="viewer" id="viewer" onclick="this.classList.remove('show')"><img id="vImg" src=""></div>
<div class="toast" id="toast"></div>

<script>
var ZION = {
  create_xy_order: 'https://zion-app.functorz.com/zero/mwLZrNj8qJA/callback/b4a14608-e61e-46b6-a748-94be7e205d0d',
  list_xy_orders: 'https://zion-app.functorz.com/zero/mwLZrNj8qJA/callback/33fde63b-4f5e-4811-aece-cf6d4cde4dc4',
  update_xy_order: 'https://zion-app.functorz.com/zero/mwLZrNj8qJA/callback/fac52f37-4c00-46ef-abce-9d41bf0511e4',
  send_xy_message: 'https://zion-app.functorz.com/zero/mwLZrNj8qJA/callback/bda9f3b9-9f40-41f7-98dc-8fe6f79aa66a',
  list_xy_messages: 'https://zion-app.functorz.com/zero/mwLZrNj8qJA/callback/ece148b9-d21f-48ca-bf69-e8c119ecc8df'
};
var OSS_BASE = 'https://my-video-storage-shihuang.oss-cn-wuhan-lr.aliyuncs.com/';
var ICON_BASE = OSS_BASE + 'xianyu/icon/';
var ossClient = new OSS({region:'oss-cn-wuhan-lr',accessKeyId:'LTAI5tBcUNsZqv33UggKtQds',accessKeySecret:'1pZrU9wXOQW64dqYeGWMBvH0JVC4qs',bucket:'my-video-storage-shihuang'});

var dySeq = new URLSearchParams(window.location.search).get('seq') || '';
var myOrders = [];
var primaryOrder = null;
var chatMsgs = [];
var asFiles = [];

if (!dySeq) {
  document.getElementById('mainContent').innerHTML = '<div class="empty-msg">链接无效，缺少订单序号</div>';
} else {
  loadOrders();
}

function loadOrders() {
  fetch(ZION.list_xy_orders, {method:'POST', headers:{'Content-Type':'application/json'}, body:'{}'})
  .then(function(r){return r.json();})
  .then(function(d) {
    var all = JSON.parse(d.orders_data || '[]');
    myOrders = all.filter(function(o) {return o.source === 'douyin' && o.dy_seq === dySeq;});
    if (!myOrders.length) {
      document.getElementById('mainContent').innerHTML = '<div class="empty-msg">未找到该订单</div>';
      return;
    }
    myOrders.sort(function(a, b) {return new Date(a.created_at) - new Date(b.created_at);});
    primaryOrder = myOrders[0];
    document.getElementById('pageTitle').textContent = primaryOrder.xianyu_name || '查看结果';
    renderContent();
  }).catch(function(e) {
    console.error(e);
    document.getElementById('mainContent').innerHTML = '<div class="empty-msg">加载失败，请刷新重试</div>';
  });
}

function renderContent() {
  var s = '';
  myOrders.forEach(function(o, i) {
    var isFirst = i === 0;
    var rfs = [];
    try {rfs = typeof o.result_files === 'string' ? JSON.parse(o.result_files) : (o.result_files || []);} catch(e) {}
    var files = [];
    try {files = typeof o.file_data === 'string' ? JSON.parse(o.file_data) : (o.file_data || []);} catch(e) {}

    s += '<div class="result-card">';
    s += '<div class="rc-title">' + (isFirst ? escHtml(o.xianyu_name || '订单结果') : '售后需求 #' + i) + '</div>';
    if (o.description) s += '<div class="rc-desc">' + escHtml(o.description).replace(/\n/g, '<br>') + '</div>';

    if (isFirst && rfs.length) {
      s += '<div class="rc-files">';
      rfs.forEach(function(f) {
        s += '<div class="rc-file" onclick="dlByName(\'' + f.url + '\',\'' + escHtml(f.name) + '\')">';
        s += '<img class="rc-file-ico" src="' + fileIconUrl(f.name) + '">';
        s += '<span class="rc-file-name">' + escHtml(f.name) + '</span></div>';
      });
      s += '</div>';
    }

    if (!isFirst) {
      var stClass = o.status === 'completed' ? 'st-done' : 'st-pending';
      var stText = o.status === 'completed' ? '已完成' : '处理中';
      s += '<div style="margin-top:8px"><span class="status-tag ' + stClass + '">' + stText + '</span></div>';
      if (o.status === 'completed' && rfs.length) {
        s += '<div class="rc-files" style="margin-top:8px">';
        rfs.forEach(function(f) {
          s += '<div class="rc-file" onclick="dlByName(\'' + f.url + '\',\'' + escHtml(f.name) + '\')">';
          s += '<img class="rc-file-ico" src="' + fileIconUrl(f.name) + '">';
          s += '<span class="rc-file-name">' + escHtml(f.name) + '</span></div>';
        });
        s += '</div>';
      }
    }
    s += '</div>';
  });
  document.getElementById('mainContent').innerHTML = s;
}

/* ===== Chat ===== */
function openChat() {
  if (!primaryOrder) {showToast('订单未加载');return;}
  document.getElementById('chatOv').classList.add('show');
  loadChatMsgs();
}
function closeChat() {
  document.getElementById('chatOv').classList.remove('show');
  chatMsgs = [];
}
function loadChatMsgs() {
  if (!primaryOrder) return;
  fetch(ZION.list_xy_messages, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({xianyu_name: primaryOrder.xianyu_name})})
  .then(function(r){return r.json();})
  .then(function(d) {
    chatMsgs = JSON.parse(d.messages_data || '[]');
    renderChatMsgs();
    scrollChatBottom();
  }).catch(function(e){console.error('Load chat error:', e);});
}
function renderChatMsgs() {
  var el = document.getElementById('chatOvMsgs');
  if (!chatMsgs.length) {el.innerHTML = '<div class="chat-empty">暂无消息，可在这里和客服沟通</div>';return;}
  var h = '';
  chatMsgs.forEach(function(m) {
    var isMe = m.sender === 'user';
    var cls = isMe ? 'msg-row me' : 'msg-row';
    var content = '';
    if (m.msg_type === 'image') {
      content = '<img src="' + m.content + '" onclick="viewImg(\'' + m.content + '\')">';
    } else if (m.msg_type === 'file') {
      content = '<div onclick="dlByName(\'' + m.content + '\',\'' + escHtml(m.file_name || '文件') + '\')" style="cursor:pointer;color:#4a90d9">📎 ' + escHtml(m.file_name || '文件') + (m.file_size ? ' (' + fmtSz(m.file_size) + ')' : '') + '</div>';
    } else {
      content = escHtml(m.content || '');
    }
    h += '<div class="msg-time">' + fmtChatTime(m.created_at) + '</div>';
    h += '<div class="' + cls + '"><div class="msg-bubble">' + content + '</div></div>';
  });
  el.innerHTML = h;
}
function scrollChatBottom() {
  setTimeout(function(){var el = document.getElementById('chatOvMsgs');el.scrollTop = el.scrollHeight;}, 50);
}
function sendText() {
  var inp = document.getElementById('chatInput');
  var txt = inp.value.trim();
  if (!txt || !primaryOrder) return;
  inp.value = '';autoGrow(inp);
  chatMsgs.push({sender:'user', msg_type:'text', content:txt, created_at:new Date().toISOString()});
  renderChatMsgs();scrollChatBottom();
  var payload = {message_json:JSON.stringify({xianyu_name:primaryOrder.xianyu_name, sender:'user', msg_type:'text', content:txt})};
  fetch(ZION.send_xy_message, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)}).catch(function(e){console.error(e);});
}
function sendImg(inp) {
  var f = inp.files[0];if (!f || !primaryOrder) return;inp.value = '';
  uploadToOSS(f, 'chat').then(function(url) {
    var payload = {message_json:JSON.stringify({xianyu_name:primaryOrder.xianyu_name, sender:'user', msg_type:'image', content:url})};
    chatMsgs.push({sender:'user', msg_type:'image', content:url, created_at:new Date().toISOString()});
    renderChatMsgs();scrollChatBottom();
    return fetch(ZION.send_xy_message, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});
  }).catch(function(e){showToast('图片发送失败');console.error(e);});
}
function sendFile(inp) {
  var f = inp.files[0];if (!f || !primaryOrder) return;inp.value = '';
  var sz = f.size;
  uploadToOSS(f, 'chat').then(function(url) {
    var payload = {message_json:JSON.stringify({xianyu_name:primaryOrder.xianyu_name, sender:'user', msg_type:'file', content:url, file_name:f.name, file_size:sz})};
    chatMsgs.push({sender:'user', msg_type:'file', content:url, file_name:f.name, file_size:sz, created_at:new Date().toISOString()});
    renderChatMsgs();scrollChatBottom();
    return fetch(ZION.send_xy_message, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});
  }).catch(function(e){showToast('文件发送失败');console.error(e);});
}
function autoGrow(el) {el.style.height = 'auto';el.style.height = el.scrollHeight + 'px';}

/* ===== After-sale ===== */
function openAfterSale() {
  if (!primaryOrder) {showToast('订单未加载');return;}
  asFiles = [];
  document.getElementById('asDesc').value = '';
  document.getElementById('asFileList').innerHTML = '';
  renderAsFileSelect();
  document.getElementById('asOv').classList.add('show');
}
function closeAfterSale() {
  document.getElementById('asOv').classList.remove('show');
}

/**
 * @description 渲染售后文件选择列表（基于主订单的结果文件）
 */
function renderAsFileSelect() {
  var rfs = [];
  try {rfs = typeof primaryOrder.result_files === 'string' ? JSON.parse(primaryOrder.result_files) : (primaryOrder.result_files || []);} catch(e){}
  var el = document.getElementById('asFileSelect');
  if (!rfs.length) {el.innerHTML = '<div style="color:#aaa;font-size:13px">暂无结果文件</div>';return;}
  var h = '';
  rfs.forEach(function(f, i) {
    h += '<label style="display:flex;align-items:center;padding:8px 0;border-bottom:1px solid #f0f0f0;cursor:pointer">';
    h += '<input type="radio" name="asTarget" value="' + escHtml(f.name) + '" style="margin-right:8px"' + (i === 0 ? ' checked' : '') + '>';
    h += '<span style="font-size:13px;color:#222">' + escHtml(f.name) + '</span></label>';
  });
  el.innerHTML = h;
}

function handleAsFiles(inp) {
  Array.from(inp.files).forEach(function(f) {
    var idx = asFiles.length;
    asFiles.push({name:f.name, size:f.size, url:'', uploading:true});
    renderAsFileList();
    uploadToOSS(f, 'file').then(function(url) {
      asFiles[idx].url = url;asFiles[idx].uploading = false;renderAsFileList();
    }).catch(function() {
      asFiles[idx].url = 'FAILED';asFiles[idx].uploading = false;renderAsFileList();
      showToast(f.name + ' 上传失败');
    });
  });
  inp.value = '';
}
function renderAsFileList() {
  var h = '';
  asFiles.forEach(function(f, i) {
    var st = f.uploading ? '<span style="color:#888;font-size:12px">上传中...</span>' : '';
    h += '<div class="as-file-row"><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + escHtml(f.name) + '</span>' + st + '<span class="rm" onclick="asFiles.splice(' + i + ',1);renderAsFileList()">删除</span></div>';
  });
  document.getElementById('asFileList').innerHTML = h;
}

function submitAfterSale() {
  var targetEl = document.querySelector('input[name="asTarget"]:checked');
  if (!targetEl) {showToast('请选择售后针对的文件');return;}
  var desc = document.getElementById('asDesc').value.trim();
  if (!desc) {showToast('请填写修改要求');return;}
  var uploading = asFiles.some(function(f){return f.uploading;});
  if (uploading) {showToast('文件还在上传中，请稍候');return;}
  var validFiles = asFiles.filter(function(f){return f.url && f.url !== 'FAILED';});
  var btn = document.getElementById('asSubmitBtn');
  btn.disabled = true;btn.textContent = '提交中...';
  var payload = {order_json:JSON.stringify({
    xianyu_name: primaryOrder.xianyu_name,
    email: '',
    deadline: new Date(Date.now() + 7 * 864e5).toISOString(),
    task_types: '售后修改',
    description: desc,
    file_data: JSON.stringify(validFiles.map(function(f){return{name:f.name, size:f.size, url:f.url};})),
    status: 'pending',
    source: 'douyin',
    dy_seq: dySeq,
    after_sale_file: targetEl.value
  })};
  fetch(ZION.create_xy_order, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)})
  .then(function(r){return r.json();})
  .then(function() {
    btn.disabled = false;btn.textContent = '提交售后';
    showToast('售后需求已提交');
    closeAfterSale();
    loadOrders();
  }).catch(function(e) {
    btn.disabled = false;btn.textContent = '提交售后';
    showToast('提交失败，请重试');console.error(e);
  });
}

/* ===== Upload ===== */
async function uploadToOSS(file, folder) {
  var ext = file.name.split('.').pop();
  var key = 'xianyu/' + folder + '/' + Date.now() + '_' + Math.random().toString(36).slice(2, 6) + '.' + ext;
  await ossClient.put(key, file);
  return OSS_BASE + key;
}

/* ===== Utilities ===== */
function escHtml(s) {return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');}
function showToast(m) {var t = document.getElementById('toast');t.textContent = m;t.classList.add('show');setTimeout(function(){t.classList.remove('show');}, 2500);}
function viewImg(src) {document.getElementById('vImg').src = src;document.getElementById('viewer').classList.add('show');}

/**
 * @param {string} url - 文件URL
 * @param {string} name - 文件名
 */
function dlByName(url, name) {
  var a = document.createElement('a');
  a.href = url;a.download = name;a.target = '_blank';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
}

/**
 * @param {string} name - 文件名
 * @return {string} 图标URL
 */
function fileIconUrl(name) {
  var ext = (name || '').split('.').pop().toLowerCase();
  var map = {
    xls:'Excel',xlsx:'Excel',csv:'Excel',
    ppt:'PPT',pptx:'PPT',pdf:'Pdf',txt:'Txt',
    doc:'Word',docx:'Word',
    zip:'压缩包',rar:'压缩包','7z':'压缩包',gz:'压缩包',
    jpg:'图片',jpeg:'图片',png:'图片',gif:'图片',webp:'图片',bmp:'图片',
    mp4:'视频',avi:'视频',mov:'视频',mkv:'视频',wmv:'视频',
    mp3:'音频',wav:'音频',flac:'音频',aac:'音频',ogg:'音频'
  };
  var t = map[ext] || '未知文件';
  return ICON_BASE + encodeURIComponent('文件类型-' + t + '.png');
}

/**
 * @param {number} n - 字节数
 * @return {string}
 */
function fmtSz(n) {
  if (n < 1024) return n + 'B';
  if (n < 1048576) return (n / 1024).toFixed(1) + 'KB';
  return (n / 1048576).toFixed(1) + 'MB';
}

/**
 * @param {string} iso - ISO时间字符串
 * @return {string}
 */
function fmtChatTime(iso) {
  if (!iso) return '';
  var d = new Date(iso);
  return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
}

document.getElementById('chatInput').addEventListener('paste', function(e) {
  var items = (e.clipboardData || e.originalEvent.clipboardData).items;
  Array.from(items).forEach(function(item) {
    if (item.type.indexOf('image') >= 0) {
      e.preventDefault();
      var f = item.getAsFile();
      uploadToOSS(f, 'chat').then(function(url) {
        var payload = {message_json:JSON.stringify({xianyu_name:primaryOrder.xianyu_name, sender:'user', msg_type:'image', content:url})};
        chatMsgs.push({sender:'user', msg_type:'image', content:url, created_at:new Date().toISOString()});
        renderChatMsgs();scrollChatBottom();
        fetch(ZION.send_xy_message, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});
      });
    }
  });
});
