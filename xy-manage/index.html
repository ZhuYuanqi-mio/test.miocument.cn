<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>排单管理</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif;background:#eef1f6;color:#2c3e50;min-height:100vh;-webkit-font-smoothing:antialiased}

.top-bar{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid #e2e8f0;padding:14px 16px 10px}
.top-bar h1{font-size:16px;font-weight:600;color:#1e293b;text-align:center;margin-bottom:10px}
.search-box{display:flex;align-items:center;background:#f1f5f9;border-radius:6px;padding:0 10px;border:1px solid #e2e8f0}
.search-box svg{flex-shrink:0;margin-right:6px;color:#94a3b8}
.search-box input{flex:1;border:none;background:none;outline:none;font-size:14px;padding:9px 0;color:#1e293b}
.search-box input::placeholder{color:#94a3b8}
.chips{display:flex;gap:6px;margin-top:8px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{padding:5px 14px;border-radius:6px;font-size:12px;white-space:nowrap;border:1px solid #d1d5db;color:#64748b;cursor:pointer;transition:all .15s;background:#fff}
.chip.on{border-color:#3a7bd5;background:#eef4fd;color:#2563eb;font-weight:500}

.container{max-width:640px;margin:0 auto;padding:12px 16px 24px}
.stats{display:flex;gap:8px;margin-bottom:14px}
.st{flex:1;text-align:center;padding:10px 0;background:#fff;border-radius:8px;border:1px solid #e2e8f0}
.st .n{font-size:20px;font-weight:700}
.st .l{font-size:11px;color:#94a3b8;margin-top:1px}
.st.s1 .n{color:#dc2626}
.st.s2 .n{color:#3a7bd5}
.st.s3 .n{color:#16a34a}

.empty{text-align:center;padding:60px 0;color:#94a3b8;font-size:14px}

.card{background:#fff;border-radius:8px;padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:transform .1s;position:relative;border:1px solid #e2e8f0;border-left:3px solid #d1d5db}
.card:active{transform:scale(.985)}
.card.c-red{border-left-color:#dc2626}
.card.c-amber{border-left-color:#f59e0b}
.card.c-green{border-left-color:#16a34a}
.card.c-gray{border-left-color:#cbd5e1;opacity:.6}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.card-name{font-size:14px;font-weight:600;color:#1e293b}
.badge{padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500}
.b-red{background:#fef2f2;color:#dc2626}
.b-amber{background:#fffbeb;color:#d97706}
.b-green{background:#f0fdf4;color:#16a34a}
.b-gray{background:#f1f5f9;color:#94a3b8}
.card-tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.card-tags span{padding:2px 7px;border-radius:3px;font-size:11px;background:#f1f5f9;color:#475569}
.card-desc{font-size:13px;color:#64748b;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:6px}
.card-thumbs{display:flex;gap:4px;margin-bottom:6px}
.card-thumbs img{width:44px;height:44px;border-radius:4px;object-fit:cover;border:1px solid #e2e8f0}
.card-thumbs .plus{width:44px;height:44px;border-radius:4px;background:#f1f5f9;display:flex;align-items:center;justify-content:center;font-size:11px;color:#94a3b8}
.card-foot{display:flex;justify-content:space-between;font-size:12px;color:#94a3b8}
.card-cd{font-size:12px;font-weight:500;margin-top:3px}
.cd-red{color:#dc2626}
.cd-amber{color:#d97706}
.cd-green{color:#16a34a}

/* detail overlay */
.detail{display:none;position:fixed;inset:0;background:#eef1f6;z-index:200;overflow-y:auto;-webkit-overflow-scrolling:touch}
.detail.show{display:block}
.detail-head{position:sticky;top:0;z-index:10;background:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e2e8f0}
.detail-head h2{font-size:15px;font-weight:600;flex:1;text-align:center;color:#1e293b}
.detail-head .bk{font-size:13px;color:#3a7bd5;cursor:pointer;min-width:44px}
.detail-head .st-btn{padding:5px 12px;border-radius:6px;border:1px solid #3a7bd5;background:none;color:#3a7bd5;font-size:12px;font-weight:500;cursor:pointer}
.detail-head .st-btn.done{border-color:#16a34a;color:#16a34a}
.detail-inner{max-width:640px;margin:0 auto;padding:14px 16px 24px}
.d-card{background:#fff;border-radius:8px;padding:14px 16px;margin-bottom:10px;border:1px solid #e2e8f0}
.d-card .lb{font-size:12px;color:#94a3b8;margin-bottom:5px}
.d-card .val{font-size:14px;color:#1e293b;line-height:1.6}
.d-card .tl{display:flex;flex-wrap:wrap;gap:6px}
.d-card .tl span{padding:5px 12px;border-radius:6px;background:#eef4fd;color:#2563eb;font-size:13px;font-weight:500}
.d-imgs{display:flex;flex-wrap:wrap;gap:8px}
.d-imgs img{width:96px;height:96px;border-radius:6px;object-fit:cover;cursor:pointer;border:1px solid #e2e8f0}
.d-files .fr{display:flex;align-items:center;padding:9px 12px;background:#f8fafc;border-radius:6px;margin-bottom:5px;font-size:13px;border:1px solid #e2e8f0}
.d-files .fr .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#334155}
.d-files .fr .sz{color:#94a3b8;margin-left:8px;font-size:12px}
.d-files .fr .dl{color:#3a7bd5;margin-left:8px;cursor:pointer;font-weight:500;font-size:12px}
.del-btn{display:block;margin:20px auto 0;padding:11px 0;width:100%;border:none;border-radius:8px;background:#fef2f2;color:#dc2626;font-size:14px;font-weight:500;cursor:pointer;border:1px solid #fecaca}

.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(30,41,59,.85);color:#fff;padding:12px 24px;border-radius:8px;font-size:14px;z-index:9999;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}

.viewer{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:300;justify-content:center;align-items:center;cursor:pointer}
.viewer.show{display:flex}
.viewer img{max-width:95%;max-height:90vh;border-radius:4px}
</style>
</head>
<body>

<div class="top-bar">
  <h1>排单管理</h1>
  <div class="search-box">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
    <input id="searchInput" placeholder="搜索名称、描述..." oninput="filterCards()">
  </div>
  <div class="chips" id="chips">
    <span class="chip on" data-f="all" onclick="pick(this)">全部</span>
    <span class="chip" data-f="urgent" onclick="pick(this)">紧急</span>
    <span class="chip" data-f="today" onclick="pick(this)">今天</span>
    <span class="chip" data-f="pending" onclick="pick(this)">待处理</span>
    <span class="chip" data-f="completed" onclick="pick(this)">已完成</span>
  </div>
</div>

<div class="container">
  <div class="stats">
    <div class="st s1"><div class="n" id="n1">0</div><div class="l">紧急</div></div>
    <div class="st s2"><div class="n" id="n2">0</div><div class="l">待处理</div></div>
    <div class="st s3"><div class="n" id="n3">0</div><div class="l">已完成</div></div>
  </div>
  <div id="list"></div>
</div>

<div class="detail" id="detailOv">
  <div class="detail-head">
    <span class="bk" onclick="closeDtl()">← 返回</span>
    <h2 id="dtlTitle"></h2>
    <button class="st-btn" id="dtlBtn" onclick="toggleSt()">标为完成</button>
  </div>
  <div class="detail-inner" id="dtlBody"></div>
</div>

<div class="viewer" id="viewer" onclick="this.classList.remove('show')"><img id="vImg" src=""></div>
<div class="toast" id="toast"></div>

<script>
var ZION={
  list_xy_orders:'https://zion-app.functorz.com/zero/mwLZrNj8qJA/callback/33fde63b-4f5e-4811-aece-cf6d4cde4dc4',
  update_xy_order:'https://zion-app.functorz.com/zero/mwLZrNj8qJA/callback/fac52f37-4c00-46ef-abce-9d41bf0511e4',
  delete_xy_order:''
};
var orders=[],curFilter='all',curIdx=null;

function load(){
  if(ZION.list_xy_orders){
    fetch(ZION.list_xy_orders,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'})
    .then(function(r){return r.json();})
    .then(function(d){
      var ls=JSON.parse(d.orders_data||'[]');
      orders=ls.map(function(o){
        var imgs=[];try{imgs=JSON.parse(o.image_data||'[]');}catch(e){}
        var fls=[];try{fls=JSON.parse(o.file_data||'[]');}catch(e){}
        return{id:o.id,xianyu_name:o.xianyu_name||'',deadline:o.deadline||'',
          task_types:(o.task_types||'').split(',').filter(Boolean),
          description:o.description||'',images:imgs,files:fls,
          status:o.status||'pending',created_at:o.created_at||''};
      });
      go();
    }).catch(function(e){console.error(e);goLocal();});
  }else goLocal();
}
function goLocal(){orders=JSON.parse(localStorage.getItem('xy_orders')||'[]');go();}
function go(){
  orders.sort(function(a,b){
    if(a.status==='completed'&&b.status!=='completed')return 1;
    if(a.status!=='completed'&&b.status==='completed')return -1;
    return new Date(a.deadline)-new Date(b.deadline);
  });
  stats();filterCards();
}

function stats(){
  var now=new Date(),u=0,p=0,d=0;
  orders.forEach(function(o){
    if(o.status==='completed'){d++;return;}
    var h=(new Date(o.deadline)-now)/36e5;
    if(h<12)u++;
    p++;
  });
  document.getElementById('n1').textContent=u;
  document.getElementById('n2').textContent=p;
  document.getElementById('n3').textContent=d;
}

function urg(o){
  if(o.status==='completed')return'done';
  var h=(new Date(o.deadline)-new Date())/36e5;
  if(h<0)return'over';if(h<12)return'urg';if(h<36)return'soon';return'ok';
}
function cd(o){
  if(o.status==='completed')return{t:'已完成',c:'cd-green'};
  var d=new Date(o.deadline)-new Date();
  if(d<0)return{t:'超时 '+dur(-d),c:'cd-red'};
  return{t:'剩余 '+dur(d),c:d<432e5?'cd-red':(d<1296e5?'cd-amber':'cd-green')};
}
function dur(ms){var h=Math.floor(ms/36e5),m=Math.floor(ms%36e5/6e4);return h>=24?Math.floor(h/24)+'天'+h%24+'时':h+'时'+m+'分';}

function pick(el){document.querySelectorAll('.chip').forEach(function(c){c.classList.remove('on');});el.classList.add('on');curFilter=el.dataset.f;filterCards();}

function filterCards(){
  var q=document.getElementById('searchInput').value.trim().toLowerCase(),h='',c=0;
  orders.forEach(function(o,i){
    var u=urg(o);
    if(curFilter==='urgent'&&u!=='urg'&&u!=='over')return;
    if(curFilter==='today'&&u!=='soon')return;
    if(curFilter==='pending'&&o.status==='completed')return;
    if(curFilter==='completed'&&o.status!=='completed')return;
    if(q&&(o.xianyu_name+' '+o.description+' '+o.task_types.join(' ')).toLowerCase().indexOf(q)<0)return;
    c++;h+=bCard(o,i);
  });
  document.getElementById('list').innerHTML=c?h:'<div class="empty">暂无订单</div>';
}

function bCard(o,i){
  var u=urg(o),g=cd(o);
  var cc=u==='over'||u==='urg'?'c-red':(u==='soon'?'c-amber':(u==='done'?'c-gray':'c-green'));
  var bc=u==='over'||u==='urg'?'b-red':(u==='soon'?'b-amber':(u==='done'?'b-gray':'b-green'));
  var bt=u==='over'?'超时':(u==='urg'?'紧急':(u==='soon'?'今天':(u==='done'?'完成':'充裕')));
  var s='<div class="card '+cc+'" onclick="openDtl('+i+')">';
  s+='<div class="card-head"><span class="card-name">'+o.xianyu_name+'</span><span class="badge '+bc+'">'+bt+'</span></div>';
  if(o.task_types.length){s+='<div class="card-tags">';o.task_types.forEach(function(t){s+='<span>'+t+'</span>';});s+='</div>';}
  if(o.description)s+='<div class="card-desc">'+o.description+'</div>';
  if(o.images&&o.images.length){
    s+='<div class="card-thumbs">';
    for(var j=0;j<Math.min(o.images.length,4);j++)s+='<img src="'+(o.images[j].url||o.images[j].data)+'">';
    if(o.images.length>4)s+='<div class="plus">+'+( o.images.length-4)+'</div>';
    s+='</div>';
  }
  var dl=o.deadline?fmtDl(o.deadline):'';
  var ft=o.files&&o.files.length?o.files.length+'个文件':'';
  s+='<div class="card-foot"><span>截止 '+dl+'</span><span>'+ft+'</span></div>';
  s+='<div class="card-cd '+g.c+'">'+g.t+'</div></div>';
  return s;
}
function fmtDl(d){var t=new Date(d);return(t.getMonth()+1)+'/'+t.getDate()+' '+('0'+t.getHours()).slice(-2)+':'+('0'+t.getMinutes()).slice(-2);}

function openDtl(i){
  curIdx=i;var o=orders[i];
  document.getElementById('dtlTitle').textContent=o.xianyu_name;
  var btn=document.getElementById('dtlBtn');
  if(o.status==='completed'){btn.textContent='恢复';btn.className='st-btn done';}
  else{btn.textContent='完成';btn.className='st-btn';}
  var g=cd(o),s='';
  s+='<div class="d-card"><div class="lb">截止时间</div><div class="val">'+fmtDl(o.deadline)+'</div><div class="card-cd '+g.c+'" style="margin-top:4px">'+g.t+'</div></div>';
  s+='<div class="d-card"><div class="lb">任务类型</div><div class="tl">';
  o.task_types.forEach(function(t){s+='<span>'+t+'</span>';});
  s+='</div></div>';
  s+='<div class="d-card"><div class="lb">要求描述</div><div class="val">'+(o.description||'无').replace(/\n/g,'<br>')+'</div></div>';
  if(o.images&&o.images.length){
    s+='<div class="d-card"><div class="lb">图片 ('+o.images.length+')</div><div class="d-imgs">';
    o.images.forEach(function(m){s+='<img src="'+(m.url||m.data)+'">';});
    s+='</div></div>';
  }
  if(o.files&&o.files.length){
    s+='<div class="d-card"><div class="lb">文件 ('+o.files.length+')</div><div class="d-files">';
    o.files.forEach(function(f,fi){
      s+='<div class="fr"><span class="nm">'+f.name+'</span>';
      if(f.size)s+='<span class="sz">'+fmtSz(f.size)+'</span>';
      s+='<span class="dl" onclick="event.stopPropagation();dlFile('+i+','+fi+')">下载</span></div>';
    });
    s+='</div></div>';
  }
  s+='<button class="del-btn" onclick="delOrder('+i+')">删除此订单</button>';
  document.getElementById('dtlBody').innerHTML=s;
  var ov=document.getElementById('detailOv');ov.classList.add('show');ov.scrollTop=0;
  document.querySelectorAll('.d-imgs img').forEach(function(img){
    img.onclick=function(e){e.stopPropagation();document.getElementById('vImg').src=img.src;document.getElementById('viewer').classList.add('show');};
  });
}
function closeDtl(){document.getElementById('detailOv').classList.remove('show');curIdx=null;}

function toggleSt(){
  if(curIdx===null)return;
  var o=orders[curIdx];
  o.status=o.status==='completed'?'pending':'completed';
  localStorage.setItem('xy_orders',JSON.stringify(orders));
  if(ZION.update_xy_order&&o.id)
    fetch(ZION.update_xy_order,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({order_id:o.id,update_json:JSON.stringify({status:o.status})})});
  toast(o.status==='completed'?'已完成':'已恢复');
  go();openDtl(orders.indexOf(o));
}
function delOrder(i){
  var o=orders[i];
  if(!confirm('删除「'+o.xianyu_name+'」？'))return;
  orders.splice(i,1);
  localStorage.setItem('xy_orders',JSON.stringify(orders));
  if(ZION.delete_xy_order&&o.id)
    fetch(ZION.delete_xy_order,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({order_id:o.id})});
  closeDtl();go();toast('已删除');
}
function dlFile(oi,fi){var f=orders[oi].files[fi];if(!f)return;var href=f.url||f.data;if(!href)return;var a=document.createElement('a');a.href=href;a.download=f.name;a.target='_blank';document.body.appendChild(a);a.click();document.body.removeChild(a);}
function fmtSz(b){return b<1024?b+'B':b<1048576?(b/1024).toFixed(1)+'KB':(b/1048576).toFixed(1)+'MB';}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2000);}

load();
setInterval(filterCards,60000);
</script>
</body>
</html>
