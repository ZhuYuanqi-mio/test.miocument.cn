<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>排单管理</title>
<script src="https://gosspublic.alicdn.com/aliyun-oss-sdk-6.18.0.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif;background:#f7f7f7;color:#222;min-height:100vh;-webkit-font-smoothing:antialiased}

.top-bar{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid #e0e0e0;padding:14px 16px 10px}
.top-bar h1{font-size:16px;font-weight:600;color:#222;text-align:center;margin-bottom:10px}
.search-row{display:flex;align-items:center;gap:8px}
.search-box{display:flex;align-items:center;background:#f2f2f2;border-radius:6px;padding:0 10px;border:1px solid #e0e0e0;flex:1}
.search-box svg{flex-shrink:0;margin-right:6px;color:#999}
.search-box input{flex:1;border:none;background:none;outline:none;font-size:14px;padding:9px 0;color:#222;min-width:0}
.search-box input::placeholder{color:#aaa}
.dy-add-btn{width:36px;height:36px;border-radius:50%;border:none;background:#222;color:#fff;font-size:20px;line-height:36px;text-align:center;cursor:pointer;flex-shrink:0}
.dy-add-btn:active{opacity:.7}
.chips{display:flex;gap:6px;margin-top:8px;overflow:visible;flex-wrap:wrap}
.chips::-webkit-scrollbar{display:none}
.chip{padding:5px 14px;border-radius:6px;font-size:12px;white-space:nowrap;border:1px solid #ccc;color:#666;cursor:pointer;transition:all .15s;background:#fff;position:relative}
.chip.on{border-color:#222;background:#222;color:#fff;font-weight:500}
.chip-drop{display:none;position:absolute;top:calc(100% + 4px);left:0;background:#fff;border:1px solid #ddd;border-radius:6px;box-shadow:0 4px 12px rgba(0,0,0,.1);z-index:60;min-width:90px;overflow:hidden}
.chip-drop.show{display:block}
.chip-drop-item{padding:8px 14px;font-size:12px;color:#444;cursor:pointer;white-space:nowrap;display:flex;align-items:center;justify-content:space-between;gap:8px}
.chip-drop-item:active{background:#f5f5f5}
.chip-drop-item.sel{font-weight:600;color:#222}
.chip-drop-item .cd-cnt{font-size:10px;color:#fff;background:#ccc;border-radius:8px;padding:0 5px;min-width:16px;text-align:center;line-height:16px}
.chip-drop-item.sel-fm .cd-cnt{background:#f0a03c}
.chip-drop-item.sel-nb .cd-cnt{background:#4a90d9}
.chip-drop-item.sel-em .cd-cnt{background:#8b5cf6}

.container{max-width:640px;margin:0 auto;padding:12px 16px 24px}
.stats{display:flex;gap:8px;margin-bottom:14px}
.st{flex:1;text-align:center;padding:10px 0;background:#fff;border-radius:8px;border:1px solid #e0e0e0}
.st .n{font-size:20px;font-weight:700}
.st .l{font-size:11px;color:#999;margin-top:1px}
.st.s1 .n{color:#c00}
.st.s2 .n{color:#222}
.st.s3 .n{color:#888}

.empty{text-align:center;padding:60px 0;color:#aaa;font-size:14px}

.card{background:#fff;border-radius:8px;padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:transform .1s;position:relative;border:1px solid #e0e0e0}
.card:active{transform:scale(.985)}
.card.c-gray{opacity:.55}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.card-name{font-size:14px;font-weight:600;color:#222}
.badge{padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500}
.b-red{background:#fef2f2;color:#c00}
.b-amber{background:#f5f5f5;color:#666}
.b-green{background:#f5f5f5;color:#888}
.b-gray{background:#f0f0f0;color:#aaa}
.unread-badge{position:absolute;top:8px;right:8px;min-width:18px;height:18px;border-radius:9px;background:#c00;color:#fff;font-size:10px;line-height:18px;text-align:center;padding:0 5px;font-weight:600}
.card-tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.card-tags span{padding:2px 7px;border-radius:3px;font-size:11px;background:#f2f2f2;color:#555}
.card-desc{font-size:13px;color:#666;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:6px}
.card-thumbs{display:flex;gap:4px;margin-bottom:6px}
.card-thumbs img{width:44px;height:44px;border-radius:4px;object-fit:cover;border:1px solid #e0e0e0}
.card-thumbs .plus{width:44px;height:44px;border-radius:4px;background:#f2f2f2;display:flex;align-items:center;justify-content:center;font-size:11px;color:#999}
.card-foot{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#999}
.foot-left{display:flex;align-items:center;gap:8px;min-width:0;overflow:hidden}
.sort-arrows{display:flex;flex-direction:column;gap:2px;flex-shrink:0}
.sort-arrows button{width:22px;height:18px;border:1px solid #ddd;background:#fff;border-radius:3px;font-size:10px;color:#666;cursor:pointer;padding:0;line-height:1;display:flex;align-items:center;justify-content:center}
.sort-arrows button:active{background:#f0f0f0;transform:scale(.95)}
.sort-arrows button:disabled{opacity:.3;cursor:default}
.assignee-grp{display:flex;gap:4px;flex-shrink:0}
.assignee-btn{padding:3px 10px;border-radius:4px;font-size:11px;font-weight:500;cursor:pointer;border:1px solid #ddd;background:#fff;color:#bbb;transition:all .15s}
.assignee-btn:active{transform:scale(.95)}
.assignee-btn.sel-fm{border-color:#f0a03c;background:#fef7eb;color:#d48c00;font-weight:600}
.assignee-btn.sel-nb{border-color:#4a90d9;background:#eef5fc;color:#2c6fad;font-weight:600}
.assignee-btn.sel-em{border-color:#8b5cf6;background:#f3eefc;color:#6b3fb8;font-weight:600}
.card-cd{font-size:12px;font-weight:500;margin-top:3px}
.cd-red{color:#c00}
.cd-amber{color:#666}
.cd-green{color:#888}

/* Detail overlay */
.detail{display:none;position:fixed;inset:0;background:#f7f7f7;z-index:200;overflow-y:auto;-webkit-overflow-scrolling:touch}
.detail.show{display:block}
.detail-head{position:sticky;top:0;z-index:10;background:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e0e0e0}
.detail-head h2{font-size:15px;font-weight:600;flex:1;text-align:center;color:#222}
.detail-head .bk{font-size:13px;color:#222;cursor:pointer;min-width:44px}
.detail-head .hd-actions{display:flex;gap:6px;min-width:90px;justify-content:flex-end}
.detail-head .st-btn{padding:5px 12px;border-radius:6px;border:1px solid #222;background:none;color:#222;font-size:12px;font-weight:500;cursor:pointer}
.detail-head .st-btn.done{border-color:#888;color:#888}
.detail-head .chat-btn{padding:5px 12px;border-radius:6px;border:1px solid #4a90d9;background:#4a90d9;color:#fff;font-size:12px;font-weight:500;cursor:pointer;position:relative}
.detail-head .chat-btn .cb-dot{position:absolute;top:-4px;right:-4px;min-width:14px;height:14px;border-radius:7px;background:#c00;color:#fff;font-size:9px;line-height:14px;text-align:center;padding:0 3px;display:none}
.detail-head .chat-btn .cb-dot.show{display:block}
.detail-inner{max-width:640px;margin:0 auto;padding:14px 16px 24px}
.d-card{background:#fff;border-radius:8px;padding:14px 16px;margin-bottom:10px;border:1px solid #e0e0e0}
.d-card .lb{font-size:12px;color:#999;margin-bottom:5px}
.d-card .val{font-size:14px;color:#222;line-height:1.6}
.d-card .tl{display:flex;flex-wrap:wrap;gap:6px}
.d-card .tl span{padding:5px 12px;border-radius:6px;background:#222;color:#fff;font-size:13px;font-weight:500}
.d-imgs{display:flex;flex-wrap:wrap;gap:8px}
.d-imgs img{width:96px;height:96px;border-radius:6px;object-fit:cover;cursor:pointer;border:1px solid #e0e0e0}
.d-files .fr{display:flex;align-items:center;padding:9px 12px;background:#fafafa;border-radius:6px;margin-bottom:5px;font-size:13px;border:1px solid #e0e0e0}
.d-files .fr .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#333}
.d-files .fr .sz{color:#999;margin-left:8px;font-size:12px}
.d-files .fr .dl{color:#222;margin-left:8px;cursor:pointer;font-weight:500;font-size:12px;text-decoration:underline}
.del-btn{display:block;margin:20px auto 0;padding:11px 0;width:100%;border:none;border-radius:8px;background:#fef2f2;color:#c00;font-size:14px;font-weight:500;cursor:pointer;border:1px solid #fcc}

/* Chat overlay */
.chat-ov{display:none;position:fixed;inset:0;background:#f7f7f7;z-index:250;flex-direction:column}
.chat-ov.show{display:flex}
.chat-ov-head{background:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e0e0e0;flex-shrink:0}
.chat-ov-head .bk{font-size:13px;color:#222;cursor:pointer;min-width:44px}
.chat-ov-head h2{font-size:15px;font-weight:600;flex:1;text-align:center;color:#222}
.chat-ov-head .sync-btn{padding:5px 12px;border-radius:6px;border:1px solid #ddd;background:#fff;color:#222;font-size:12px;cursor:pointer;min-width:74px;text-align:center}
.chat-ov-head .sync-btn:active{background:#f2f2f2}
.chat-ov-msgs{flex:1;overflow-y:auto;padding:12px 16px;-webkit-overflow-scrolling:touch}
.chat-ov-msgs .chat-empty{text-align:center;padding:60px 0;color:#aaa;font-size:14px}

.msg-row{display:flex;margin-bottom:14px;align-items:flex-start}
.msg-row.me{flex-direction:row-reverse}
.msg-avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;flex-shrink:0}
.msg-body{max-width:70%;margin:0 10px}
.msg-bubble{padding:10px 14px;border-radius:12px;font-size:14px;line-height:1.5;word-break:break-word}
.msg-row.other .msg-bubble{background:#fff;color:#222;border:1px solid #e0e0e0;border-top-left-radius:4px}
.msg-row.me .msg-bubble{background:#4a90d9;color:#fff;border-top-right-radius:4px}
.msg-time{font-size:11px;color:#aaa;margin-top:3px}
.msg-row.me .msg-time{text-align:right}
.msg-bubble img.msg-img{max-width:200px;max-height:200px;border-radius:6px;cursor:pointer;display:block}
.msg-file-card{display:flex;align-items:center;background:#fff;border-radius:8px;padding:10px 12px;min-width:200px;cursor:pointer;border:1px solid #e0e0e0}
.msg-row.me .msg-file-card{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.2)}
.msg-file-card img.file-ico{width:36px;height:36px;flex-shrink:0;margin-right:10px}
.msg-file-card .file-info{flex:1;min-width:0}
.msg-file-card .file-info .fn{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msg-file-card .file-info .fs{font-size:11px;color:#999;margin-top:2px}
.msg-file-card .dl-icon{width:28px;height:28px;flex-shrink:0;margin-left:8px;border-radius:50%;background:#4a90d9;display:flex;align-items:center;justify-content:center}
.msg-file-card .dl-icon svg{width:14px;height:14px;stroke:#fff}
.msg-row.me .msg-file-card .file-info .fn{color:#fff}
.msg-row.me .msg-file-card .file-info .fs{color:rgba(255,255,255,.6)}

.chat-ov-input{background:#fff;border-top:1px solid #e0e0e0;padding:8px 12px;display:flex;align-items:flex-end;gap:8px;flex-shrink:0}
.chat-ov-input .ci-actions{display:flex;gap:4px;flex-shrink:0;padding-bottom:4px}
.chat-ov-input .ci-btn{width:32px;height:32px;border-radius:50%;border:1px solid #ddd;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#666}
.chat-ov-input .ci-btn:active{background:#f0f0f0}
.chat-ov-input .ci-btn svg{width:16px;height:16px}
.chat-ov-input textarea{flex:1;border:1px solid #ddd;border-radius:8px;padding:8px 10px;font-size:14px;resize:none;outline:none;max-height:100px;min-height:36px;font-family:inherit;line-height:1.4;background:#fafafa}
.chat-ov-input textarea:focus{border-color:#555}
.chat-ov-input .send-btn{padding:8px 16px;border:none;border-radius:8px;background:#222;color:#fff;font-size:13px;font-weight:600;cursor:pointer;flex-shrink:0;align-self:flex-end}
.chat-ov-input .send-btn:active{opacity:.7}

/* ===== Edit Deadline Modal ===== */
.dl-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:400;justify-content:center;align-items:center;padding:24px}
.dl-modal.show{display:flex}
.dl-box{background:#fff;border-radius:12px;max-width:360px;width:100%;padding:24px 20px 18px}
.dl-box h3{font-size:15px;font-weight:700;color:#222;margin-bottom:14px;text-align:center}
.dl-box label{font-size:13px;font-weight:500;color:#333;margin-bottom:5px;display:block}
.dl-box input[type=datetime-local]{width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:6px;font-size:14px;outline:none;background:#fafafa;margin-bottom:12px;-webkit-appearance:none;appearance:none;height:42px}
.dl-box input:focus,.dl-box textarea:focus{border-color:#555}
.dl-box textarea{width:100%;min-height:60px;padding:10px 12px;border:1px solid #ddd;border-radius:6px;font-size:14px;font-family:inherit;resize:vertical;outline:none;background:#fafafa;margin-bottom:14px}
.dl-box .dl-btns{display:flex;gap:8px}
.dl-box .dl-btns button{flex:1;padding:10px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:none}
.dl-box .dl-btns .dl-cancel{background:#f2f2f2;color:#666}
.dl-box .dl-btns .dl-ok{background:#222;color:#fff}
.dl-box .dl-btns button:active{opacity:.75}

.ds-btn{padding:4px 14px;border-radius:5px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid #ddd;background:#fff;color:#888;margin-right:4px;transition:all .15s}
.ds-btn:active{transform:scale(.95)}
.ds-btn.ds-active{border-color:#222;background:#222;color:#fff}
.cm-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:400;justify-content:center;align-items:center;padding:24px}
.cm-modal.show{display:flex}
.cm-box{background:#fff;border-radius:12px;max-width:400px;width:100%;padding:24px 20px 18px;max-height:85vh;overflow-y:auto}
.cm-box h3{font-size:15px;font-weight:700;color:#222;margin-bottom:14px;text-align:center}
.cm-section{margin-bottom:14px}
.cm-section .cm-lb{font-size:13px;font-weight:500;color:#333;margin-bottom:6px;display:flex;align-items:center}
.cm-section .cm-hint{font-size:11px;color:#c00;margin-left:6px;font-weight:400}
.cm-preview{margin-top:6px}
.cm-preview video{width:100%;max-height:160px;border-radius:6px;border:1px solid #e0e0e0}
.cm-file-item{display:flex;align-items:center;padding:6px 10px;background:#fafafa;border-radius:6px;font-size:12px;border:1px solid #e0e0e0;margin-bottom:4px}
.cm-file-item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cm-file-item .rm{color:#c00;margin-left:8px;cursor:pointer;font-size:11px}
.cm-img-preview{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.cm-img-preview img{width:72px;height:72px;border-radius:6px;object-fit:cover;border:1px solid #e0e0e0}
.cm-btns{display:flex;gap:8px;margin-top:16px}
.cm-btns button{flex:1;padding:10px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:none}
.cm-btns .cm-cancel{background:#f2f2f2;color:#666}
.cm-btns .cm-ok{background:#222;color:#fff}
.cm-btns button:active{opacity:.75}
.cm-upload-btn{display:inline-block;padding:6px 14px;border-radius:6px;border:1px solid #ddd;background:#fff;color:#4a90d9;font-size:12px;cursor:pointer;margin-left:8px}
.cm-upload-btn:active{background:#f8f8f8}
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(34,34,34,.9);color:#fff;padding:12px 24px;border-radius:8px;font-size:14px;z-index:9999;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
.viewer{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:300;justify-content:center;align-items:center;cursor:pointer}
.viewer.show{display:flex}
.viewer img{max-width:95%;max-height:90vh;border-radius:4px}
.cl-date{font-size:13px;font-weight:600;color:#999;padding:10px 0 4px;border-bottom:1px solid #eee;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.cl-row{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:#fff;border-radius:8px;margin-bottom:6px;border:1px solid #eee}
.cl-info{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.cl-name{font-size:14px;font-weight:600;color:#222;white-space:nowrap}
.cl-type{font-size:12px;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cl-view{padding:5px 12px;border-radius:6px;border:1px solid #ccc;background:#fff;color:#555;font-size:12px;cursor:pointer;white-space:nowrap;flex-shrink:0}
.cl-view:active{background:#f5f5f5}

/* Salesperson modal */
.sp-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:400;justify-content:center;align-items:center;padding:24px}
.sp-modal.show{display:flex}
.sp-box{background:#fff;border-radius:12px;max-width:400px;width:100%;padding:24px 20px 18px;max-height:85vh;overflow-y:auto}
.sp-box h3{font-size:15px;font-weight:700;color:#222;margin-bottom:14px;text-align:center}
.sp-list{margin-bottom:16px}
.sp-item{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:#fafafa;border-radius:6px;margin-bottom:6px;border:1px solid #eee}
.sp-item .sp-name{font-size:14px;font-weight:600;color:#222}
.sp-item .sp-id{font-size:12px;color:#999;margin-left:8px}
.sp-item .sp-actions{display:flex;gap:6px}
.sp-item .sp-copy-btn,.sp-item .sp-del-btn{padding:4px 10px;border-radius:4px;font-size:11px;cursor:pointer;border:1px solid #ddd;background:#fff}
.sp-item .sp-copy-btn{color:#4a90d9;border-color:#4a90d9}
.sp-item .sp-copy-btn:active{background:#eef5fc}
.sp-item .sp-del-btn{color:#c00;border-color:#fcc}
.sp-item .sp-del-btn:active{background:#fef2f2}
.sp-create{display:flex;gap:8px}
.sp-create input{flex:1;padding:10px 12px;border:1px solid #ddd;border-radius:6px;font-size:14px;outline:none;background:#fafafa}
.sp-create input:focus{border-color:#555}
.sp-create button{padding:10px 18px;border:none;border-radius:6px;background:#222;color:#fff;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.sp-create button:active{opacity:.75}
.sp-empty{text-align:center;padding:20px 0;color:#aaa;font-size:13px}

/* Salesperson dropdown item style */
.chip-drop-item.sel-sp .cd-cnt{background:#10b981}
.assignee-btn.sel-sp{border-color:#10b981;background:#ecfdf5;color:#059669;font-weight:600}
.chip-drop-sep{height:1px;background:#eee;margin:4px 0}
</style>
</head>
<body>

<div class="top-bar">
  <h1>排单管理 <span onclick="openSpModal()" style="display:inline-flex;align-items:center;vertical-align:middle;cursor:pointer;margin-left:6px;opacity:.5" title="销售员管理"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4-4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg></span></h1>
  <div class="search-row">
    <div class="search-box">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <input id="searchInput" placeholder="搜索名称、描述..." oninput="filterCards()">
    </div>
    <button class="dy-add-btn" onclick="openDyCreate()">+</button>
  </div>
  <div class="chips">
    <span class="chip on" data-f="pending" onclick="togglePendingDrop(event)" id="chipPending">未完成 ▾
      <div class="chip-drop" id="pendingDrop"></div>
    </span>
    <span class="chip" data-f="urgent" onclick="pick(this)">紧急</span>
    <span class="chip" data-f="douyin" onclick="pick(this)">抖音</span>
    <span class="chip" data-f="approval" onclick="pick(this)">审批<span id="approvalBadge" style="display:none;position:absolute;top:-6px;right:-6px;min-width:16px;height:16px;border-radius:8px;background:#c00;color:#fff;font-size:10px;line-height:16px;text-align:center;padding:0 4px"></span></span>

/* ===== Load orders + unread ===== */
function load(){
  if(ZION.list_xy_orders){
    fetch(ZION.list_xy_orders,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'})
    .then(function(r){return r.json();})

      var ls=JSON.parse(d.orders_data||'[]');
      orders=ls.map(function(o){
        var imgs=[];try{imgs=JSON.parse(o.image_data||'[]');}catch(e){}
        var fls=[];try{fls=JSON.parse(o.file_data||'[]');}catch(e){}
        var rfs=[];try{rfs=JSON.parse(o.result_files||'[]');}catch(e){}
        return{id:o.id,xianyu_name:o.xianyu_name||'',email:o.email||'',deadline:o.deadline||'',
          task_types:(o.task_types||'').split(',').filter(Boolean),
          description:o.description||'',images:imgs,files:fls,
          status:o.status||'pending',chat_notes:o.chat_notes||'',can_edit:!!o.can_edit,assignee:o.assignee||'',
          result_files:rfs,result_video:o.result_video||'',delivery_status:o.delivery_status||'',
          receipt_screenshot:o.receipt_screenshot||'',after_sale_file:o.after_sale_file||'',
          survey_link:o.survey_link||'',survey_province:o.survey_province||'',survey_midnight:o.survey_midnight||'',
          need_survey:o.need_survey||'',approved_at:o.approved_at||'',
          source:o.source||'xianyu',dy_seq:o.dy_seq||'',
          sort_order:(o.sort_order==null?null:Number(o.sort_order)),
          created_at:o.created_at||''};
      });
      inheritAssignees();
      go();
    }).catch(function(e){console.error(e);goLocal();});
  }else goLocal();
  loadUnreadCounts();
}
function goLocal(){orders=JSON.parse(localStorage.getItem('xy_orders')||'[]');go();}
function go(){
  orders.sort(function(a,b){
    if(a.status==='completed'&&b.status!=='completed')return 1;
    if(a.status!=='completed'&&b.status==='completed')return -1;
    var ao=(a.sort_order==null?Infinity:a.sort_order);
    var bo=(b.sort_order==null?Infinity:b.sort_order);
    if(ao!==bo)return ao-bo;
    return new Date(a.deadline)-new Date(b.deadline);
  });
  buildPendingDrop();
  stats();filterCards();updateCompletedBadge();updateApprovalBadge();updateSurveyBadge();updateUnreadBadge();
}

function loadUnreadCounts(){
  if(!ZION.unread_xy_counts) return;
  fetch(ZION.unread_xy_counts,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'})
  .then(function(r){return r.json();})
  .then(function(d){
    unreadMap=JSON.parse(d.counts_data||'{}');
    filterCards();
    updateCompletedBadge();
    updateUnreadBadge();
  }).catch(function(e){console.error('Unread counts error:',e);});
}

/**
 * @description 更新"未读"chip 上的总计未读消息数徽标
 */
function updateUnreadBadge(){
  var total=0;
  Object.keys(unreadMap).forEach(function(name){total+=(unreadMap[name]||0);});
  var badge=document.getElementById('unreadBadge');
  if(total>0){badge.textContent=total;badge.style.display='block';}
  else{badge.style.display='none';}
}

function updateCompletedBadge(){
  var total=0;
  orders.forEach(function(o){
    if(o.status==='completed' && unreadMap[o.xianyu_name]){
      total+=unreadMap[o.xianyu_name];
    }
  });
  var badge=document.getElementById('completedBadge');
  if(total>0){badge.textContent=total;badge.style.display='block';}
  else{badge.style.display='none';}
}

function stats(){
  var now=new Date(),u=0,p=0,d=0;
  orders.forEach(function(o){
    if(o.source==='douyin')return;
    if(o.status==='completed'){d++;return;}
    var h=(new Date(o.deadline)-now)/36e5;
    if(h<12)u++;p++;
  });
  document.getElementById('n1').textContent=u;
  document.getElementById('n2').textContent=p;
  document.getElementById('n3').textContent=d;
}
function urg(o){
  if(o.status==='completed')return'done';
  var h=(new Date(o.deadline)-new Date())/36e5;
  if(h<0)return'over';if(h<12)return'urg';if(h<36)return'soon';return'ok';
}
function cd(o){
  if(o.status==='completed')return{t:'已完成',c:'cd-green'};
  var d=new Date(o.deadline)-new Date();
  if(d<0)return{t:'超时 '+dur(-d),c:'cd-red'};
  return{t:'剩余 '+dur(d),c:d<432e5?'cd-red':(d<1296e5?'cd-amber':'cd-green')};
}
function dur(ms){var h=Math.floor(ms/36e5),m=Math.floor(ms%36e5/6e4);return h>=24?Math.floor(h/24)+'天'+h%24+'时':h+'时'+m+'分';}

function deleteSalesperson(id){

    for(var si=0;si<spList.length;si++){if(spList[si].id===spId){txt=spList[si].name;break;}}

function filterCards(){
  var q=document.getElementById('searchInput').value.trim().toLowerCase();
  if(curFilter==='completed'){renderCompletedList(q);updateDropCounts();return;}
  if(curFilter==='unread'){renderUnreadList(q);updateDropCounts();return;}
  var h='',c=0;
  orders.forEach(function(o,i){
    var u=urg(o);
    if(curFilter==='urgent'&&u!=='urg'&&u!=='over')return;
    if(curFilter==='douyin'&&o.source!=='douyin')return;
    if(curFilter!=='douyin'&&curFilter!=='all'&&o.source==='douyin')return;
    if(curFilter==='pending'){
      if(o.status==='completed')return;
      if(pendingSub==='feimi'&&o.assignee!=='肥咪')return;
      if(pendingSub==='nubi'&&o.assignee!=='努比')return;
      if(pendingSub==='ermao'&&o.assignee!=='二猫')return;
      if(pendingSub==='unassigned'&&o.assignee)return;
      if(pendingSub.indexOf('sales_')===0){
        var spId=pendingSub.slice(6);
        if(!(o.source==='sales'&&o.dy_seq===spId))return;
      }
    }
    if(curFilter==='approval'&&!(o.status==='completed'&&o.delivery_status==='pending_approval'))return;
    if(curFilter==='survey'&&!(o.status==='completed'&&(o.delivery_status==='pending_survey'||o.delivery_status==='survey_filling')))return;
    if(q&&(o.xianyu_name+' '+o.description+' '+o.task_types.join(' ')).toLowerCase().indexOf(q)<0)return;
    c++;h+=bCard(o,i);
  });
  document.getElementById('list').innerHTML=c?h:'<div class="empty">暂无订单</div>';
  updateDropCounts();
}

/**
 * @description 渲染未读消息列表，按未读数从高到低显示
 * @param {string} q - 搜索关键词
 */
function renderUnreadList(q){
  var rows=[];
  Object.keys(unreadMap).forEach(function(name){
    var cnt=unreadMap[name]||0;
    if(cnt<=0)return;
    if(q&&name.toLowerCase().indexOf(q)<0)return;
    rows.push({name:name,cnt:cnt});
  });
  if(!rows.length){document.getElementById('list').innerHTML='<div class="empty">暂无未读消息</div>';return;}
  rows.sort(function(a,b){return b.cnt-a.cnt;});
  var h='<div class="cl-date"><span>未读消息</span><span style="font-weight:400;font-size:12px">合计 '+rows.length+' 人</span></div>';
  rows.forEach(function(r){
    h+='<div class="cl-row" data-name="'+escHtml(r.name)+'" onclick="openChatByName(this.dataset.name)" style="cursor:pointer">';
    h+='<div class="cl-info"><span class="cl-name">'+escHtml(r.name)+'</span>';
    h+='<span style="display:inline-block;min-width:20px;height:20px;border-radius:10px;background:#c00;color:#fff;font-size:11px;line-height:20px;text-align:center;padding:0 6px;font-weight:600;margin-left:8px">'+r.cnt+'</span>';
    h+='</div>';
    h+='<span class="cl-view">查看消息</span>';
    h+='</div>';
  });
  document.getElementById('list').innerHTML=h;
}

/**
 * @description 按日期分组渲染已完成订单列表
 * @param {string} q - 搜索关键词
 */
function renderCompletedList(q){
  var grouped={};
  orders.forEach(function(o,i){
    if(o.status!=='completed'||o.source==='douyin')return;
    if(q&&(o.xianyu_name+' '+o.description+' '+o.task_types.join(' ')).toLowerCase().indexOf(q)<0)return;
    var dt=o.approved_at||o.created_at||'';
    var day=dt?new Date(dt).toLocaleDateString('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit'}):'未知日期';
    if(!grouped[day])grouped[day]=[];
    grouped[day].push({o:o,idx:i,ts:dt?new Date(dt).getTime():0});
  });
  var days=Object.keys(grouped).sort(function(a,b){
    var ta=grouped[a][0].ts,tb=grouped[b][0].ts;
    return tb-ta;
  });
  if(!days.length){document.getElementById('list').innerHTML='<div class="empty">暂无已完成订单</div>';return;}
  var h='';
  days.forEach(function(day){
    h+='<div class="cl-date"><span>'+day+'</span><span style="font-weight:400;font-size:12px">合计 '+grouped[day].length+' 份</span></div>';
    grouped[day].sort(function(a,b){return b.ts-a.ts;});
    grouped[day].forEach(function(item){
      var o=item.o,i=item.idx;
      var uc=unreadMap[o.xianyu_name]||0;
      var dot=uc>0?'<span style="display:inline-block;min-width:18px;height:18px;border-radius:9px;background:#c00;color:#fff;font-size:10px;line-height:18px;text-align:center;padding:0 5px;font-weight:600;margin-left:6px">'+uc+'</span>':'';
      h+='<div class="cl-row">';
      h+='<div class="cl-info"><span class="cl-name">'+escHtml(o.xianyu_name)+'</span>'+dot+'<span class="cl-type">'+escHtml(o.task_types.join(', '))+'</span></div>';
      h+='<span class="cl-view" onclick="openDtl('+i+')">查看详情</span>';
      h+='</div>';
    });
  });
  document.getElementById('list').innerHTML=h;
}
function updateDropCounts(){
  var all=0,ua=0,fm=0,nb=0,em=0;
  var spCounts={};
  orders.forEach(function(o){
    if(o.status==='completed'||o.source==='douyin')return;
    all++;
    if(!o.assignee)ua++;
    if(o.assignee==='肥咪')fm++;
    if(o.assignee==='努比')nb++;
    if(o.assignee==='二猫')em++;
    if(o.source==='sales'&&o.dy_seq){
      spCounts[o.dy_seq]=(spCounts[o.dy_seq]||0)+1;
    }
  });
  var elAll=document.getElementById('cntAll');if(elAll)elAll.textContent=all;
  var elUa=document.getElementById('cntUa');if(elUa)elUa.textContent=ua;
  var elFm=document.getElementById('cntFm');if(elFm)elFm.textContent=fm;
  var elNb=document.getElementById('cntNb');if(elNb)elNb.textContent=nb;
  var elEm=document.getElementById('cntEm');if(elEm)elEm.textContent=em;
  var spList=getSalespeople();
  spList.forEach(function(sp){
    var el=document.getElementById('cntSp_'+sp.id);
    if(el)el.textContent=spCounts[sp.id]||0;
  });
}
function imgSrc(m){return m.url||m.data||'';}
function bCard(o,i){
  var u=urg(o),g=cd(o);
  var cc=u==='over'||u==='urg'?'c-red':(u==='soon'?'c-amber':(u==='done'?'c-gray':'c-green'));
  var bc=u==='over'||u==='urg'?'b-red':(u==='soon'?'b-amber':(u==='done'?'b-gray':'b-green'));
  var bt=u==='over'?'超时':(u==='urg'?'紧急':(u==='soon'?'今天':(u==='done'?'完成':'充裕')));
  var s='<div class="card '+cc+'" onclick="openDtl('+i+')">';
  var uc=unreadMap[o.xianyu_name]||0;
  if(uc>0) s+='<div class="unread-badge">'+uc+'</div>';
  var isSh=o.task_types.indexOf('售后修改')>=0;
  var isEditReq=!o.can_edit&&o.status==='pending'&&(o.chat_notes||'').indexOf('[申请修改]')>=0;
  s+='<div class="card-head"><span class="card-name">'+o.xianyu_name+'</span><span style="display:flex;gap:4px;align-items:center">'+(isEditReq?'<span class="badge" style="background:#eef6ff;color:#4a90d9">申请修改</span>':'')+(isSh?'<span class="badge" style="background:#fff7ed;color:#c60">售后</span>':'')+'<span class="badge '+bc+'">'+bt+'</span></span></div>';
  if(o.email) s+='<div style="font-size:12px;color:#888;margin-bottom:4px">'+o.email+'</div>';
  if(o.task_types.length){s+='<div class="card-tags">';o.task_types.forEach(function(t){s+='<span>'+t+'</span>';});s+='</div>';}
  if(o.description)s+='<div class="card-desc">'+o.description+'</div>';
  if(o.images&&o.images.length){
    s+='<div class="card-thumbs">';
    for(var j=0;j<Math.min(o.images.length,4);j++)s+='<img src="'+imgSrc(o.images[j])+'">';
    if(o.images.length>4)s+='<div class="plus">+'+( o.images.length-4)+'</div>';
    s+='</div>';
  }
  var dl=o.deadline?fmtDl(o.deadline):'';
  var ft=o.files&&o.files.length?o.files.length+'个文件':'';
  var canSort=o.status!=='completed'&&o.source!=='douyin'&&(curFilter==='pending'||curFilter==='urgent'||curFilter==='all');
  var arrowsHtml='';
  if(canSort){
    arrowsHtml='<span class="sort-arrows"><button onclick="event.stopPropagation();moveOrder('+i+',-1)" title="上移">↑</button><button onclick="event.stopPropagation();moveOrder('+i+',1)" title="下移">↓</button></span>';
  }
  s+='<div class="card-foot"><span class="foot-left">'+arrowsHtml+'<span>截止 '+dl+(ft?' · '+ft:'')+'</span></span>';
  var agExpanded=expandedSet[i];
  if(o.assignee&&!agExpanded){
    var aClsMap={'肥咪':'assignee-btn sel-fm','努比':'assignee-btn sel-nb','二猫':'assignee-btn sel-em'};
    var aCls=aClsMap[o.assignee]||'assignee-btn';
    s+='<div class="assignee-grp" id="ag'+i+'">';
    s+='<button class="'+aCls+'" onclick="event.stopPropagation();expandAssignee('+i+')">'+o.assignee+'</button>';
    s+='</div>';
  } else {
    var fmCls2=o.assignee==='肥咪'?'assignee-btn sel-fm':'assignee-btn';
    var nbCls2=o.assignee==='努比'?'assignee-btn sel-nb':'assignee-btn';
    var emCls2=o.assignee==='二猫'?'assignee-btn sel-em':'assignee-btn';
    s+='<div class="assignee-grp" id="ag'+i+'">';
    s+='<button class="'+fmCls2+'" onclick="event.stopPropagation();setAssignee('+i+',\'肥咪\')">肥咪</button>';
    s+='<button class="'+nbCls2+'" onclick="event.stopPropagation();setAssignee('+i+',\'努比\')">努比</button>';
    s+='<button class="'+emCls2+'" onclick="event.stopPropagation();setAssignee('+i+',\'二猫\')">二猫</button>';
    s+='</div>';
  }
  s+='</div>';
  s+='<div class="card-cd '+g.c+'">'+g.t+'</div></div>';
  return s;
}

function fileIconUrl(name){
  var ext=(name||'').split('.').pop().toLowerCase();
  var map={xls:'Excel',xlsx:'Excel',csv:'Excel',ppt:'PPT',pptx:'PPT',pdf:'Pdf',txt:'Txt',doc:'Word',docx:'Word',
    zip:'压缩包',rar:'压缩包','7z':'压缩包',gz:'压缩包',
    jpg:'图片',jpeg:'图片',png:'图片',gif:'图片',webp:'图片',bmp:'图片',
    mp4:'视频',avi:'视频',mov:'视频',mkv:'视频',
    mp3:'音频',wav:'音频',flac:'音频',aac:'音频',
    exe:'程序',app:'程序',dmg:'程序'};
  var t=map[ext]||'未知文件';
  return ICON_BASE+encodeURIComponent('文件类型-'+t+'.png');
}
function fmtChatTime(iso){
  var d=new Date(iso),now=new Date();
  var pad=function(n){return n<10?'0'+n:n;};
  var time=pad(d.getHours())+':'+pad(d.getMinutes());
  if(d.toDateString()===now.toDateString())return time;
  return(d.getMonth()+1)+'/'+d.getDate()+' '+time;
}
function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function renderChatMsgs(){
  var el=document.getElementById('chatOvMsgs');
  if(!chatMsgs.length){el.innerHTML='<div class="chat-empty">暂无消息</div>';return;}
  var h='';
  chatMsgs.forEach(function(m){
    var isMe=m.sender==='admin';
    var cls=isMe?'msg-row me':'msg-row other';
    var avatar=isMe?ADMIN_AVATAR:USER_AVATAR;
    var noteContent=m.msg_type==='file'?(m.file_name||'文件'):(m.content||'');
    var dblHandler=' ondblclick="appendChatNote('+escAttr(noteContent)+')"';
    h+='<div class="'+cls+'">';
    h+='<img class="msg-avatar" src="'+avatar+'">';
    h+='<div class="msg-body">';
    if(m.msg_type==='image'){
      h+='<div class="msg-bubble"'+dblHandler+'><img class="msg-img" src="'+m.content+'" onclick="viewImg(\''+m.content+'\')"></div>';
    }else if(m.msg_type==='file'){
      var fname=m.file_name||m.content.split('/').pop()||'文件';
      var fsize=m.file_size||'';
      h+='<div class="msg-bubble" style="padding:0;overflow:hidden;border:none;background:none"'+dblHandler+'><div class="msg-file-card" onclick="dlByName(\''+m.content+'\',\''+escHtml(fname)+'\')">';
      h+='<img class="file-ico" src="'+fileIconUrl(fname)+'">';
      h+='<div class="file-info"><div class="fn">'+escHtml(fname)+'</div><div class="fs">'+fsize+'</div></div>';
      h+='<div class="dl-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></div>';
      h+='</div></div>';
    }else{

/**
 * @description 获取当前筛选视图下可排序的待办订单列表（已按 sort_order+截止时间排序）
 * @return {Array} 含 {o, i} 的数组
 */
function getVisiblePendingList(){
  var q=document.getElementById('searchInput').value.trim().toLowerCase();
  var list=[];
  orders.forEach(function(o,i){
    if(o.status==='completed'||o.source==='douyin')return;
    var u=urg(o);
    if(curFilter==='urgent'&&u!=='urg'&&u!=='over')return;
    if(curFilter==='pending'){
      if(pendingSub==='feimi'&&o.assignee!=='肥咪')return;
      if(pendingSub==='nubi'&&o.assignee!=='努比')return;
      if(pendingSub==='ermao'&&o.assignee!=='二猫')return;
      if(pendingSub==='unassigned'&&o.assignee)return;
      if(pendingSub.indexOf('sales_')===0){
        var spId2=pendingSub.slice(6);
        if(!(o.source==='sales'&&o.dy_seq===spId2))return;
      }
    }
    if(q&&(o.xianyu_name+' '+o.description+' '+o.task_types.join(' ')).toLowerCase().indexOf(q)<0)return;
    list.push({o:o,i:i});
  });
  list.sort(function(a,b){
    var ao=(a.o.sort_order==null?Infinity:a.o.sort_order);
    var bo=(b.o.sort_order==null?Infinity:b.o.sort_order);
    if(ao!==bo)return ao-bo;
    return new Date(a.o.deadline)-new Date(b.o.deadline);
  });
  return list;
}

/**
 * @description 上下移动订单在当前视图中的位置
 * @param {number} idx - orders 数组中的订单索引
 * @param {number} dir - -1 上移 / 1 下移
 */
function moveOrder(idx,dir){
  var visible=getVisiblePendingList();
  var pos=-1;
  for(var j=0;j<visible.length;j++){if(visible[j].i===idx){pos=j;break;}}
  if(pos<0)return;
  var newPos=pos+dir;
  if(newPos<0||newPos>=visible.length)return;
  var needInit=visible.some(function(v){return v.o.sort_order==null;});
  if(needInit){visible.forEach(function(v,p){v.o.sort_order=p;});}
  var a=visible[pos].o,b=visible[newPos].o;
  var tmp=a.sort_order;a.sort_order=b.sort_order;b.sort_order=tmp;
  var toPersist=needInit?visible.map(function(v){return v.o;}):[a,b];
  if(ZION.update_xy_order){
    toPersist.forEach(function(o){
      if(!o.id)return;
      fetch(ZION.update_xy_order,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({order_id:o.id,update_json:JSON.stringify({sort_order:o.sort_order})})});
    });
  }
  go();
}

/**

 * @param {number} i - 订单索引
 * @return {boolean}
 */
function isFirstOrder(i){
  if(i===null)return true;
  var o=orders[i];
  var hasOtherCompleted=orders.some(function(x){
    return x!==o&&x.xianyu_name===o.xianyu_name&&x.status==='completed'&&x.source!=='douyin';
  });
  return !hasOtherCompleted;
}

function submitComplete(){

  var hasWord=cmFiles.some(function(f){return !f.isImg&&/\.docx?$/i.test(f.name);});

  var o=orders[cmIdx];
  var rfData=cmFiles.map(function(f){return{name:f.name,size:f.size,url:f.url};});
  var needSurvey='否';
  if(!hasWord){
    document.querySelectorAll('.cm-survey-opt').forEach(function(s){
      if(s.style.fontWeight==='500') needSurvey=s.getAttribute('data-v');
    });
  }
  var updateObj={status:'completed',delivery_status:'unreceived',result_files:JSON.stringify(rfData),need_survey:needSurvey};
  if(cmVideoUrl) updateObj.result_video=cmVideoUrl;
  o.status='completed';
  o.delivery_status='unreceived';
  o.result_files=rfData;
  o.need_survey=needSurvey;
  if(cmVideoUrl) o.result_video=cmVideoUrl;
  fetch(ZION.update_xy_order,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({order_id:o.id,update_json:JSON.stringify(updateObj)})});
  closeCompleteModal();
  toast('已完成');
  go();openDtl(orders.indexOf(o));
}

/**
 * @description 生成下一个抖音订单序号
 * @return {string}
 */
function nextDySeq(){
  var max=0;
  orders.forEach(function(o){
    if(o.source==='douyin'&&o.dy_seq){
      var n=parseInt(o.dy_seq,10);
      if(n>max) max=n;
    }
  });
  return String(max+1);
}

  var validFiles=dyFiles.filter(function(f){return f.url&&f.url!=='FAILED';});
  var seq=nextDySeq();
  var payload={order_json:JSON.stringify({
    xianyu_name:title,
    email:'',
    deadline:new Date(Date.now()+7*864e5).toISOString(),
    task_types:'抖音订单',
    description:desc,
    file_data:JSON.stringify(validFiles.map(function(f){return{name:f.name,size:f.size,url:f.url};})),
    result_files:JSON.stringify(validFiles.map(function(f){return{name:f.name,size:f.size,url:f.url};})),
    status:'completed',

    source:'douyin',

  })};

  okBtn.disabled=true;okBtn.textContent='提交中...';
  fetch(ZION.create_xy_order,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
  .then(function(r){return r.json();})
  .then(function(){
    okBtn.disabled=false;okBtn.textContent='提交并生成链接';
    closeDyCreate();
    var link='https://test.miocument.cn/dy-order/?seq='+seq;
    prompt('订单创建成功！用户链接（已可复制）：',link);
    load();
  }).catch(function(e){
    okBtn.disabled=false;okBtn.textContent='提交并生成链接';
    toast('创建失败');console.error(e);
  });
}
