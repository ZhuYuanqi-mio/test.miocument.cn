<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>咯咯哒生态农场 · 后台管理</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://gosspublic.alicdn.com/aliyun-oss-sdk-6.18.0.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--green:#4B9E3F;--green-light:#EDF7EB;--green-dark:#3D8535;--red:#E4393C;--orange:#F0A03C;--text-1:#333;--text-2:#666;--text-3:#999;--border:#e8e8e8;--bg:#f5f5f5;--white:#fff;--radius:10px}
body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text-1);line-height:1.5}
a{color:inherit;text-decoration:none}
button{border:none;background:none;cursor:pointer;font-family:inherit;font-size:inherit}
input,select,textarea{font-family:inherit;font-size:inherit;outline:none}

.app-header{background:var(--white);border-bottom:1px solid var(--border);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.app-header h1{font-size:18px;color:var(--text-1);display:flex;align-items:center;gap:8px}
.app-header h1 span{color:var(--green);font-weight:400;font-size:13px;background:var(--green-light);padding:2px 8px;border-radius:4px}
.header-actions{display:flex;gap:10px;align-items:center}

.container{max-width:100%;margin:0 auto;padding:20px 32px}

.stats-bar{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-bottom:20px}
.stat-card{background:var(--white);border-radius:var(--radius);padding:16px 20px;border:1px solid var(--border)}
.stat-card .sc-val{font-size:28px;font-weight:700;color:var(--text-1)}
.stat-card .sc-label{font-size:13px;color:var(--text-3);margin-top:2px}
.stat-card.green .sc-val{color:var(--green)}
.stat-card.orange .sc-val{color:var(--orange)}
.stat-card.red .sc-val{color:var(--red)}

.toolbar{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.search-input{height:38px;border:1px solid var(--border);border-radius:8px;padding:0 14px;font-size:14px;width:260px;background:var(--white)}
.search-input:focus{border-color:var(--green)}
.filter-select{height:38px;border:1px solid var(--border);border-radius:8px;padding:0 12px;font-size:13px;background:var(--white);color:var(--text-1);min-width:120px}
.btn{display:inline-flex;align-items:center;justify-content:center;height:38px;border-radius:8px;font-size:13px;font-weight:500;padding:0 18px;cursor:pointer;transition:opacity .15s}
.btn:active{opacity:.7}
.btn-primary{background:var(--green);color:#fff}
.btn-outline{border:1px solid var(--green);color:var(--green);background:var(--white)}
.btn-outline-gray{border:1px solid #ddd;color:var(--text-2);background:var(--white)}
.btn-danger{border:1px solid var(--red);color:var(--red);background:var(--white)}
.btn-sm{height:30px;font-size:12px;padding:0 12px;border-radius:6px}
.tag{display:inline-block;font-size:11px;line-height:20px;padding:0 8px;border-radius:3px;font-weight:500}
.tag-green{background:var(--green-light);color:var(--green)}
.tag-orange{background:#FFF3E0;color:#E68A00}
.tag-gray{background:#f0f0f0;color:var(--text-3)}
.tag-red{background:#FFEBEE;color:var(--red)}
.tag-blue{background:#E3F2FD;color:#1976D2}

.upload-zone{border:2px dashed #ccc;border-radius:var(--radius);padding:40px;text-align:center;background:var(--white);cursor:pointer;transition:border-color .2s,background .2s}
.upload-zone:hover{border-color:var(--green);background:var(--green-light)}
.upload-zone.dragover{border-color:var(--green);background:var(--green-light)}
.upload-zone h3{font-size:16px;color:var(--text-1);margin-bottom:6px}
.upload-zone p{font-size:13px;color:var(--text-3)}

.order-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.order-card{background:var(--white);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden;transition:box-shadow .2s}
.order-card:hover{box-shadow:0 2px 12px rgba(0,0,0,.06)}
.oc-head{padding:14px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #f0f0f0}
.oc-avatar{width:40px;height:40px;border-radius:50%;background:var(--green-light);color:var(--green);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;flex-shrink:0}
.oc-info{flex:1;min-width:0}
.oc-name{font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px}
.oc-sub{font-size:12px;color:var(--text-3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oc-body{padding:14px 16px}
.oc-row{display:flex;justify-content:space-between;font-size:13px;line-height:2}
.oc-row .rl{color:var(--text-3)}
.oc-row .rv{color:var(--text-1);font-weight:500;text-align:right;max-width:60%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oc-delivery{margin-top:10px;padding-top:10px;border-top:1px solid #f0f0f0}
.oc-delivery-title{font-size:12px;color:var(--text-3);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.oc-delivery-grid{display:flex;flex-wrap:wrap;gap:4px}
.oc-d-item{font-size:11px;padding:3px 8px;border-radius:4px;background:#f5f5f5;color:var(--text-2)}
.oc-d-item.done{background:var(--green-light);color:var(--green)}
.oc-d-item.current{background:var(--green);color:#fff}
.oc-d-item.strawberry{background:#FFF3E0;color:#E68A00}
.oc-foot{padding:10px 16px;border-top:1px solid #f0f0f0;display:flex;gap:8px;flex-wrap:wrap}

.overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:200;align-items:center;justify-content:center}
.overlay.show{display:flex}
.modal{background:var(--white);border-radius:12px;width:90%;max-width:480px;max-height:80vh;display:flex;flex-direction:column;animation:modalIn .2s ease}
@keyframes modalIn{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}
.modal-head h3{font-size:16px;font-weight:600}
.modal-head .close{font-size:20px;color:var(--text-3);width:28px;height:28px;display:flex;align-items:center;justify-content:center}
.modal-body{padding:20px;overflow-y:auto;flex:1}
.modal-foot{padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;color:var(--text-3);margin-bottom:6px}
.form-group input,.form-group select,.form-group textarea{width:100%;border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:14px}
.form-group input:focus,.form-group textarea:focus{border-color:var(--green)}
.form-group textarea{resize:none;min-height:60px}

.toast{display:none;position:fixed;top:20px;right:20px;background:var(--green);color:#fff;padding:12px 24px;border-radius:8px;font-size:14px;z-index:999;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.toast.show{display:block;animation:toastSlide 2.5s ease forwards}
@keyframes toastSlide{0%{opacity:0;transform:translateX(30px)}10%{opacity:1;transform:translateX(0)}85%{opacity:1}100%{opacity:0}}
.empty-state{text-align:center;padding:80px 0}
.empty-state h3{font-size:18px;color:var(--text-2);margin-bottom:8px}
.empty-state p{font-size:14px;color:var(--text-3)}

.filter-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.filter-row label{font-size:12px;color:var(--text-3);white-space:nowrap}
.filter-row input[type=date],.filter-row input[type=number]{height:34px;border:1px solid var(--border);border-radius:6px;padding:0 10px;font-size:13px;background:var(--white);width:140px}
.filter-row input:focus{border-color:var(--green)}
.view-toggle{display:inline-flex;border:1px solid var(--border);border-radius:6px;overflow:hidden;margin-left:auto}
.view-toggle button{padding:6px 14px;font-size:12px;background:var(--white);border:none;color:var(--text-2);cursor:pointer}
.view-toggle button.on{background:var(--green);color:#fff;font-weight:500}

.order-table{width:100%;border-collapse:collapse;background:var(--white);border-radius:var(--radius);overflow:hidden;border:1px solid var(--border);font-size:13px;table-layout:auto}
.order-table th{background:#f9f9f9;padding:10px 12px;text-align:left;font-weight:600;font-size:12px;color:var(--text-3);border-bottom:1px solid var(--border);white-space:nowrap}
.order-table td{padding:10px 12px;border-bottom:1px solid #f5f5f5;color:var(--text-1);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.order-table tr:hover td{background:#fafffe}
.order-table .tbl-actions{display:flex;gap:6px;align-items:center}
.tbl-icon{width:30px;height:30px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s;border:none;background:none;padding:0}
.tbl-icon:hover{background:#f0f0f0}
.tbl-icon svg{width:18px;height:18px}
.tbl-icon[title="删除"]:hover{background:#ffebee}
.tbl-icon[title="已完成"]:hover{background:var(--green-light)}
.tbl-icon[title="选菜"]:hover{background:#E8F5E9}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #f0f0f0}
.toggle-row .tr-label{font-size:14px;font-weight:500}
.toggle-sw{position:relative;width:44px;height:24px;cursor:pointer}
.toggle-sw input{display:none}
.toggle-sw .slider{position:absolute;top:0;left:0;right:0;bottom:0;background:#ccc;border-radius:12px;transition:.2s}
.toggle-sw .slider::before{content:'';position:absolute;width:18px;height:18px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.2s}
.toggle-sw input:checked+.slider{background:var(--green)}
.toggle-sw input:checked+.slider::before{transform:translateX(20px)}
.veg-list{margin:12px 0;max-height:240px;overflow-y:auto}
.veg-item{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-radius:8px;margin-bottom:4px;background:#fafafa}
.veg-item:hover{background:var(--green-light)}
.veg-item .vi-name{font-size:14px;color:var(--text-1)}
.veg-item .vi-del{font-size:12px;color:var(--red);cursor:pointer;padding:2px 8px;border-radius:4px}
.veg-item .vi-del:hover{background:#ffebee}
.veg-add-row{display:flex;gap:8px;margin-top:12px}
.veg-add-row input{flex:1;border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:14px}
.veg-add-row input:focus{border-color:var(--green)}
.veg-ctrl-list{max-height:400px;overflow-y:auto}
.veg-ctrl-row{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid #f5f5f5}
.veg-ctrl-row .vcr-label{font-size:14px;font-weight:500;min-width:60px}
.veg-ctrl-row .vcr-vegs{flex:1;font-size:12px;color:var(--text-3);margin:0 12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.veg-ctrl-detail{background:#f9fff9;border-left:3px solid var(--green);margin:0 0 4px 0;padding:10px 12px 8px 16px;border-radius:0 0 8px 8px}
.veg-ctrl-detail .vchk-list{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:10px}
.vchk-item{display:flex;align-items:center;gap:5px;font-size:13px;cursor:pointer;padding:4px 10px;border:1px solid #ddd;border-radius:16px;background:#fff;transition:.15s}
.vchk-item.checked{background:var(--green-light);border-color:var(--green);color:var(--green);font-weight:500}
.vchk-item.checked::before{content:'✓ ';font-size:11px}
.stepper{display:inline-flex;align-items:center}
.stepper button{width:32px;height:32px;border:1px solid #ddd;background:var(--white);font-size:16px;color:var(--text-2);display:flex;align-items:center;justify-content:center}
.stepper button:first-child{border-radius:6px 0 0 6px}
.stepper button:last-child{border-radius:0 6px 6px 0}
.stepper-val{width:56px;height:32px;border-top:1px solid #ddd;border-bottom:1px solid #ddd;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600}
.img-upload{margin-top:4px}
.img-upload-zone{border:1px dashed #ccc;border-radius:8px;padding:16px;text-align:center;cursor:pointer;transition:border-color .2s;background:#fafafa}
.img-upload-zone:hover{border-color:var(--green);background:var(--green-light)}
.img-upload-zone svg{display:block;margin:0 auto 6px}
.img-upload-zone span{font-size:13px;color:var(--text-3)}
.img-preview-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.img-preview-item{position:relative;width:72px;height:72px;border-radius:6px;overflow:hidden;border:1px solid var(--border)}
.img-preview-item img{width:100%;height:100%;object-fit:cover}
.img-preview-item .img-del{position:absolute;top:2px;right:2px;width:20px;height:20px;background:rgba(0,0,0,.55);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;line-height:1}
.dup-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#FFF8E1;border-radius:6px;margin-bottom:6px;font-size:13px}
.dup-item .dup-idx{width:24px;height:24px;border-radius:50%;background:var(--orange);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0}
.dup-item .dup-info{flex:1;min-width:0}
.dup-item .dup-name{font-weight:600;color:var(--text-1)}
.dup-item .dup-detail{font-size:12px;color:var(--text-3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

@media(max-width:768px){
  .app-header{padding:0 14px;height:48px}
  .app-header h1{font-size:15px;gap:6px}
  .app-header h1 span{font-size:11px;padding:1px 6px}
  .container{padding:12px 12px}
  .stats-bar{grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
  .stat-card{padding:10px 12px}
  .stat-card .sc-val{font-size:20px}
  .stat-card .sc-label{font-size:11px}
  .toolbar{gap:8px;margin-bottom:12px}
  .search-input{width:100%;font-size:14px}
  .filter-select{flex:1;min-width:0;font-size:13px}
  .order-grid{grid-template-columns:1fr!important;gap:12px}
  .oc-head{padding:12px 14px;gap:8px}
  .oc-avatar{width:36px;height:36px;font-size:14px}
  .oc-name{font-size:14px;flex-wrap:wrap;gap:4px}
  .oc-sub{font-size:11px}
  .oc-body{padding:10px 14px}
  .oc-row{font-size:12px;line-height:1.8}
  .oc-foot{padding:10px 14px;gap:6px}
  .btn-sm{height:28px;font-size:11px;padding:0 10px}
  .btn{height:34px;font-size:12px;padding:0 14px}
  .upload-zone{padding:28px 16px}
  .upload-zone h3{font-size:14px}
  .upload-zone p{font-size:12px}
  .modal{width:94%;max-width:none;border-radius:10px;max-height:85vh}
  .modal-head{padding:12px 16px}
  .modal-head h3{font-size:15px}
  .modal-body{padding:14px 16px}
  .modal-foot{padding:10px 16px}
  .toast{top:12px;right:12px;left:12px;text-align:center;font-size:13px;padding:10px 16px}
  .empty-state{padding:50px 0}
  .empty-state h3{font-size:16px}
  .filter-row{gap:6px!important}
  .filter-row input[type=date],.filter-row input[type=number]{width:110px!important;font-size:12px;height:32px}
  .filter-row label{font-size:11px}
  .view-toggle button{padding:5px 10px;font-size:11px}
  .order-table{font-size:12px}
  .order-table th,.order-table td{padding:8px 8px}
}

@media(max-width:374px){
  .stats-bar{grid-template-columns:repeat(2,1fr)}
  .stat-card .sc-val{font-size:18px}
  .oc-name{font-size:13px}
  .oc-row{font-size:11px}
}
</style>
</head>
<body>

<div class="app-header">
  <h1>咯咯哒生态农场 <span>后台管理</span></h1>
  <div class="header-actions">
    <button class="btn btn-outline" onclick="openVegModal()">菜品管理</button>
    <button class="btn btn-outline" onclick="openManualAdd()">手动录入</button>
    <button class="btn btn-outline" onclick="triggerImport()">导入表格</button>
    <button class="btn btn-primary" onclick="exportExcel()">导出表格</button>
    <input type="file" id="fileInput" accept=".xlsx,.xls" style="display:none" onchange="handleFile(this)">
  </div>
</div>

<div class="container">
  <div class="stats-bar" id="statsBar" style="display:none">
    <div class="stat-card"><div class="sc-val" id="s-total">0</div><div class="sc-label">订单总数</div></div>
    <div class="stat-card green"><div class="sc-val" id="s-egg">0</div><div class="sc-label">鸡蛋会员</div></div>
    <div class="stat-card green"><div class="sc-val" id="s-veg">0</div><div class="sc-label">蔬菜会员</div></div>
    <div class="stat-card orange"><div class="sc-val" id="s-other">0</div><div class="sc-label">鸡/草莓/菜地</div></div>
    <div class="stat-card"><div class="sc-val" id="s-amount">0</div><div class="sc-label">总收入(元)</div></div>
  </div>

  <div class="toolbar" id="toolbar" style="display:none">
    <input type="text" class="search-input" placeholder="搜索微信名、商品、会员类型..." oninput="filterCards()" id="searchInput">
    <select class="filter-select" id="filterType" onchange="filterCards()">
      <option value="">全部类型</option>
      <option value="鸡蛋会员">鸡蛋会员</option>
      <option value="蔬菜会员">蔬菜会员</option>
      <option value="鸡会员">鸡会员</option>
      <option value="草莓会员">草莓会员</option>
      <option value="共享菜地">共享菜地</option>
    </select>
    <select class="filter-select" id="filterStatus" onchange="filterCards()">
      <option value="">全部状态</option>
      <option value="active">进行中</option>
      <option value="done">已完成</option>
    </select>
    <div class="view-toggle">
      <button class="on" id="vCard" onclick="switchView('card')">卡片</button>
      <button id="vList" onclick="switchView('list')">列表</button>
    </div>
  </div>
  <div class="filter-row" id="filterRow" style="display:none;margin-bottom:14px">
    <label>日期</label>
    <input type="date" id="dateFrom" onchange="filterCards()">
    <span style="color:var(--text-3)">~</span>
    <input type="date" id="dateTo" onchange="filterCards()">
    <label style="margin-left:12px">金额</label>
    <input type="number" id="amtMin" placeholder="最低" onchange="filterCards()" style="width:90px">
    <span style="color:var(--text-3)">~</span>
    <input type="number" id="amtMax" placeholder="最高" onchange="filterCards()" style="width:90px">
    <button class="btn btn-sm btn-outline-gray" onclick="resetFilters()" style="margin-left:4px">重置</button>
  </div>

  <div id="uploadArea">
    <div class="upload-zone" id="dropZone" onclick="triggerImport()">
      <h3>点击或拖拽导入 Excel 表格</h3>
      <p>支持 .xlsx / .xls 格式，将自动解析会员信息</p>
    </div>
  </div>

  <div class="order-grid" id="orderGrid"></div>
  <div style="display:none;overflow-x:auto" id="orderTableWrap"><table class="order-table" id="orderTable"></table></div>
  <div class="empty-state" id="emptyState" style="display:none">
    <h3>没有匹配的结果</h3>
    <p>试试调整搜索条件或筛选项</p>
  </div>
</div>

<!-- 调整次数弹窗 -->
<div class="overlay" id="adjustModal">
  <div class="modal">
    <div class="modal-head"><h3>调整配送次数</h3><button class="close" onclick="closeModal('adjustModal')">X</button></div>
    <div class="modal-body">
      <div class="form-group">
        <label>客户</label>
        <input type="text" id="adj-name" readonly style="background:#f9f9f9">
      </div>
      <div class="form-group">
        <label>当前次数/数量</label>
        <input type="text" id="adj-current" readonly style="background:#f9f9f9">
      </div>
      <div class="form-group">
        <label>调整数量</label>
        <div style="display:flex;align-items:center;gap:12px">
          <div class="stepper">
            <button onclick="stepAdj(-1)">-</button>
            <div class="stepper-val" id="adj-val">0</div>
            <button onclick="stepAdj(1)">+</button>
          </div>
          <span style="font-size:13px;color:var(--text-3)" id="adj-result"></span>
        </div>
      </div>
      <div class="form-group">
        <label>变更原因</label>
        <select id="adj-reason"><option>客户续费</option><option>赠送补偿</option><option>订单退款</option><option>数据纠正</option><option>其他原因</option></select>
      </div>
      <div class="form-group">
        <label>备注</label>

async function callZion(url, data){

function toISO(d){ return d?(d.indexOf('T')>=0?d:d+'T00:00:00+08:00'):null; }
function unitByType(t){ return t==='鸡会员'?'只':t==='草莓会员'?'斤':t==='共享菜地'?'月':'次'; }

async function syncToBackend(list){
  var ok=0,fail=0;
  showToast('正在同步到后端（'+list.length+'条）...');
  for(var i=0;i<list.length;i++){
    var o=list[i];
    try{
      var payload={phone:'',wechat_name:o.wechat,source:o.source,repurchase:o.repurchase,
        member_type:o.memberType,category:o.category,product_name:o.productName,
        total_count:o.totalNum,total_unit:unitByType(o.memberType),
        price:parseNum(o.price),discount:parseNum(o.discount),amount_paid:o.amount,
        platform:o.platform,pay_time:toISO(o.payTime),
        delivery_method:o.deliveryMethod,status:'active'};
      var r=await callZion(ZION.create_order,{order_json:JSON.stringify(payload)});
      if(r&&r.order_id){o.backendId=r.order_id;ok++;}
      else{fail++;console.error('create_order fail:',o.wechat,r);}
    }catch(e){fail++;console.error('sync error:',e);}
  }
  if(fail>0)showToast('后端同步：成功 '+ok+' / 失败 '+fail);
  else showToast('后端同步完成：'+ok+' 条订单已入库');
}

async function loadFromBackend(){
  if(ZION.list_orders==='PLACEHOLDER') return;
  try{
    document.getElementById('dropZone').innerHTML='<h3>正在加载数据...</h3><p>从后端获取订单中</p>';
    var res=await callZion(ZION.list_orders,{});
    if(!res||!res.orders_data) return;
    var list=JSON.parse(res.orders_data);
    if(!list||!list.length){
      document.getElementById('dropZone').innerHTML='<h3>点击或拖拽导入 Excel 表格</h3><p>支持 .xlsx / .xls 格式，将自动解析会员信息</p>';
      return;
    }
    orders=list.map(function(bo){
      var isStrawberry=bo.member_type==='草莓会员';
      var deliveries=[];
      if(bo.delivery_records){
        bo.delivery_records.forEach(function(dr){
          if(isStrawberry) deliveries.push((dr.delivery_date||'')+' '+(dr.quantity||0)+'斤');
          else deliveries.push(dr.delivery_date||dr.note||'');
        });
      }
      if(bo.status==='completed'&&!isStrawberry&&bo.member_type!=='共享菜地') deliveries.push('已完成');
      var totalNum=bo.total_count||0;
      var unit=bo.total_unit||unitByType(bo.member_type);
      return {
        idx:nextIdx++, backendId:bo.id,
        yearMonth:'', platform:bo.platform||'',
        payTime:bo.pay_time?bo.pay_time.split('T')[0]:'',
        deliveryMethod:bo.delivery_method||'',

        amount:bo.amount_paid||0, wechat:bo.wechat_name||'',
        source:bo.source||'', repurchase:bo.repurchase||'',
        memberType:bo.member_type||'', deliveries:deliveries,
        doneCount:bo.delivery_records?bo.delivery_records.length:0,
        paused:bo.status==='paused',
        deliveryVegs:bo.farm_delivery_vegs||[],

function triggerImport(){ document.getElementById('fileInput').click(); }

var dz = document.getElementById('dropZone');
dz.addEventListener('dragover', function(e){ e.preventDefault(); dz.classList.add('dragover'); });
dz.addEventListener('dragleave', function(){ dz.classList.remove('dragover'); });
dz.addEventListener('drop', function(e){
  e.preventDefault(); dz.classList.remove('dragover');
  var f = e.dataTransfer.files[0];
  if(f) parseExcel(f);
});

function handleFile(input){
  if(input.files[0]) parseExcel(input.files[0]);
  input.value = '';
}

function parseExcel(file){
  var reader = new FileReader();
  reader.onload = function(e){
    var wb = XLSX.read(e.target.result, {type:'array', cellDates:true});
    var ws = wb.Sheets[wb.SheetNames[0]];
    var data = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
    if(data.length < 2){ showToast('表格为空'); return; }
    processData(data);
  };
  reader.readAsArrayBuffer(file);
}

function parseNum(v){
  if(typeof v === 'number') return v;
  var s = String(v).replace(/[^0-9.\-]/g,'');
  var n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}

function fmtDate(v){
  if(!v) return '';
  if(v instanceof Date) return v.getFullYear()+'-'+(v.getMonth()+1<10?'0':'')+(v.getMonth()+1)+'-'+(v.getDate()<10?'0':'')+v.getDate();
  var n = parseFloat(v);
  if(!isNaN(n) && n > 40000 && n < 60000){
    var d = new Date((n - 25569)*86400000);
    return d.getFullYear()+'-'+(d.getMonth()+1<10?'0':'')+(d.getMonth()+1)+'-'+(d.getDate()<10?'0':'')+d.getDate();
  }
  return String(v);
}

function buildOrderKey(o){
  return (o.wechat + '||' + o.productName + '||' + o.payTime).toLowerCase();
}

function parseRow(r){
  var deliveries = [];
  for(var j = 14; j < r.length; j++){
    if(r[j] !== '' && r[j] !== null && r[j] !== undefined){
      deliveries.push(String(r[j]) === '完' ? '已完成' : fmtDate(r[j]) || String(r[j]));
    }
  }
  var totalStr = String(r[6] || '');
  var totalNum = parseNum(totalStr);
  var memberType = String(r[13] || '');
  var category = String(r[4] || '');
  var doneCount = 0;
  var isStrawberry = memberType === '草莓会员';
  var isGarden = memberType === '共享菜地';
  if(!isStrawberry && !isGarden){
    doneCount = deliveries.filter(function(d){ return d !== '已完成'; }).length;
    if(deliveries.indexOf('已完成') >= 0) doneCount = deliveries.indexOf('已完成');
    else doneCount = deliveries.length;
  }
  var amount = parseNum(r[9]);
  return {
    idx: nextIdx++,
    yearMonth: String(r[0] || ''),
    platform: String(r[1] || ''),
    payTime: fmtDate(r[2]),
    deliveryMethod: String(r[3] || ''),
    category: category,
    productName: String(r[5] || ''),
    totalStr: totalStr,
    totalNum: totalNum || 0,
    price: String(r[7] || ''),
    discount: String(r[8] || ''),
    amount: amount,
    wechat: String(r[10] || ''),
    source: String(r[11] || ''),
    repurchase: String(r[12] || ''),
    memberType: memberType,
    deliveries: deliveries,
    doneCount: doneCount,
    paused: false
  };
}

function processData(data){
  var existingKeys = {};
  orders.forEach(function(o){ existingKeys[buildOrderKey(o)] = true; });

  var newOrders = [];
  var dups = [];
  for(var i = 1; i < data.length; i++){
    var r = data[i];
    if(!r[10]) continue;
    var o = parseRow(r);
    var key = buildOrderKey(o);
    if(existingKeys[key]){
      dups.push(o);
    } else {
      newOrders.push(o);
      existingKeys[key] = true;
    }
  }

  orders = orders.concat(newOrders);

  if(dups.length > 0){
    pendingDups = dups;
    document.getElementById('dup-count').textContent = dups.length;
    var h = '';
    dups.forEach(function(d, i){
      h += '<div class="dup-item"><span class="dup-idx">'+(i+1)+'</span>';
      h += '<div class="dup-info"><div class="dup-name">'+d.wechat+'</div>';
      h += '<div class="dup-detail">'+d.productName+' · '+d.payTime+' · ¥'+d.amount.toFixed(2)+'</div></div></div>';
    });
    document.getElementById('dup-list').innerHTML = h;
    document.getElementById('dupModal').classList.add('show');
    renderAll();
    showToast('新增 ' + newOrders.length + ' 条，' + dups.length + ' 条重复');
    if(newOrders.length) syncToBackend(newOrders);
  } else {
    renderAll();
    showToast('导入成功，新增 ' + newOrders.length + ' 条订单（共 ' + orders.length + ' 条）');
    syncToBackend(newOrders);
  }
}

function forceImportDups(){
  var toSync = [];
  pendingDups.forEach(function(dup){
    var key = buildOrderKey(dup);
    for(var i = orders.length - 1; i >= 0; i--){
      if(buildOrderKey(orders[i]) === key){
        orders.splice(i, 1);
        break;
      }
    }
    orders.push(dup);
    toSync.push(dup);
  });
  closeModal('dupModal');
  renderAll();
  showToast('已覆盖 ' + pendingDups.length + ' 条重复数据');
  pendingDups = [];
  syncToBackend(toSync);
}

function updateStats(){
  var egg=0,veg=0,other=0,totalAmt=0;
  orders.forEach(function(o){
    if(o.memberType==='鸡蛋会员') egg++;
    else if(o.memberType==='蔬菜会员') veg++;
    else other++;
    totalAmt += o.amount;
  });
  document.getElementById('s-total').textContent = orders.length;
  document.getElementById('s-egg').textContent = egg;
  document.getElementById('s-veg').textContent = veg;
  document.getElementById('s-other').textContent = other;
  document.getElementById('s-amount').textContent = totalAmt.toFixed(0);
}

function getStatusTag(o){
  if(o.memberType === '草莓会员') return '<span class="tag tag-orange">草莓会员</span>';
  if(o.memberType === '共享菜地') return '<span class="tag tag-blue">共享菜地</span>';
  if(o.paused) return '<span class="tag tag-orange">已暂停</span>';
  var hasComplete = o.deliveries.indexOf('已完成') >= 0;
  if(hasComplete && o.deliveries[o.deliveries.length-1] === '已完成') return '<span class="tag tag-gray">已完成</span>';
  return '<span class="tag tag-green">进行中</span>';
}

function getStatusKey(o){
  if(o.memberType === '草莓会员' || o.memberType === '共享菜地') return 'active';
  var hasComplete = o.deliveries.indexOf('已完成') >= 0;
  if(hasComplete && o.deliveries[o.deliveries.length-1] === '已完成') return 'done';
  return 'active';
}

var currentView = 'card';

function applyFilter(){
  var kw = document.getElementById('searchInput').value.toLowerCase();
  var type = document.getElementById('filterType').value;
  var status = document.getElementById('filterStatus').value;
  var dateFrom = document.getElementById('dateFrom').value;
  var dateTo = document.getElementById('dateTo').value;
  var amtMin = document.getElementById('amtMin').value;
  var amtMax = document.getElementById('amtMax').value;
  return orders.filter(function(o){
    if(type && o.memberType !== type) return false;
    if(status && getStatusKey(o) !== status) return false;
    if(kw){
      var haystack = (o.wechat + o.productName + o.memberType + o.category + o.totalStr).toLowerCase();
      if(haystack.indexOf(kw) < 0) return false;
    }
    if(dateFrom && o.payTime && o.payTime < dateFrom) return false;
    if(dateTo && o.payTime && o.payTime > dateTo) return false;
    if(amtMin !== '' && o.amount < parseFloat(amtMin)) return false;
    if(amtMax !== '' && o.amount > parseFloat(amtMax)) return false;
    return true;
  });
}

function filterCards(){
  var filtered = applyFilter();
  if(currentView === 'card'){
    renderCards(filtered);
    document.getElementById('orderGrid').style.display = '';
    document.getElementById('orderTableWrap').style.display = 'none';
  } else {
    renderTable(filtered);
    document.getElementById('orderGrid').style.display = 'none';
    document.getElementById('orderTableWrap').style.display = '';
  }
}

function resetFilters(){
  document.getElementById('dateFrom').value = '';
  document.getElementById('dateTo').value = '';
  document.getElementById('amtMin').value = '';
  document.getElementById('amtMax').value = '';
  filterCards();
}

function getOrderByIdx(idx){
  for(var i=0;i<orders.length;i++) if(orders[i].idx===idx) return orders[i];
  return null;
}

function openAdjust(idx){
  var o = getOrderByIdx(idx);
  adjData = {idx:idx, total:o.totalNum, delta:0};
  document.getElementById('adj-name').value = o.wechat + ' · ' + o.memberType;
  document.getElementById('adj-current').value = o.totalStr;
  document.getElementById('adj-val').textContent = '0';
  document.getElementById('adj-result').textContent = '调整后：' + o.totalStr;
  document.getElementById('adj-note').value = '';
  document.getElementById('adj-imgs').innerHTML = '';
  document.getElementById('adjustModal').classList.add('show');
}
function stepAdj(d){
  adjData.delta += d;
  document.getElementById('adj-val').textContent = (adjData.delta>0?'+':'')+adjData.delta;
  var r = Math.max(0, adjData.total + adjData.delta);
  document.getElementById('adj-result').textContent = '调整后：' + r;
  document.getElementById('adj-result').style.color = adjData.delta>0?'var(--green)':adjData.delta<0?'var(--red)':'var(--text-3)';
}
function confirmAdj(){
  var o = getOrderByIdx(adjData.idx);
  var oldTotal = o.totalNum;
  var newTotal = Math.max(0, oldTotal + adjData.delta);
  o.totalNum = newTotal;
  o.totalStr = String(newTotal) + unitByType(o.memberType);
  var reason = document.getElementById('adj-reason').value;
  var note = document.getElementById('adj-note').value;
  var imgEls = document.getElementById('adj-imgs').querySelectorAll('.img-preview-item img');
  if(imgEls.length){
    var existing = orderImages[adjData.idx] || [];
    imgEls.forEach(function(img){ existing.push(img.src); });
    orderImages[adjData.idx] = existing;
  }
  closeModal('adjustModal');
  filterCards();
  showToast('配送次数调整成功');
  if(o.backendId){
    callZion(ZION.update_order,{order_id:o.backendId,update_json:JSON.stringify({total_count:newTotal})});
    callZion(ZION.create_adjust_log,{log_json:JSON.stringify({
      order_id:o.backendId,action:'adjust_count',old_value:String(oldTotal),
      new_value:String(newTotal),reason:reason,note:note,image_url:'',operator:'管理员'
    })});
  }
}

function openDeduct(idx){
  currentDeductIdx = idx;
  var o = getOrderByIdx(idx);
  var used = 0;
  o.deliveries.forEach(function(d){
    var m = d.match(/([\d.]+)斤/);
    if(m) used += parseFloat(m[1]);
  });
  var remain = o.totalNum - used;
  document.getElementById('ded-name').value = o.wechat + ' · 草莓会员';
  document.getElementById('ded-remain').value = remain.toFixed(2) + '斤';
  document.getElementById('ded-val').value = '';
  document.getElementById('ded-note').value = '';
  document.getElementById('ded-imgs').innerHTML = '';
  document.getElementById('deductModal').classList.add('show');
}
function confirmDeduct(){
  var o = getOrderByIdx(currentDeductIdx);
  var raw = document.getElementById('ded-val').value.trim();
  var qty = parseFloat(raw);
  if(!raw || isNaN(qty) || qty <= 0){ alert('请输入有效的消耗数量'); return; }
  var note = document.getElementById('ded-note').value;
  var today = new Date();
  var ds = today.getFullYear()+'-'+('0'+(today.getMonth()+1)).slice(-2)+'-'+('0'+today.getDate()).slice(-2);
  o.deliveries.push(ds+' '+qty+'斤');
  var imgEls = document.getElementById('ded-imgs').querySelectorAll('.img-preview-item img');
  if(imgEls.length && currentDeductIdx !== null){
    var existing = orderImages[currentDeductIdx] || [];
    imgEls.forEach(function(img){ existing.push(img.src); });
    orderImages[currentDeductIdx] = existing;
  }
  closeModal('deductModal');
  filterCards();
  showToast('消耗扣除成功');
  if(o.backendId){
    callZion(ZION.create_delivery_record,{record_json:JSON.stringify({
      order_id:o.backendId,period:o.deliveries.length,delivery_date:ds,
      quantity:qty,unit:'斤',note:note||qty+'斤',status:'done'
    })});
    callZion(ZION.create_adjust_log,{log_json:JSON.stringify({
      order_id:o.backendId,action:'deduct',old_value:'',new_value:qty+'斤',
      reason:'草莓消耗',note:note,image_url:'',operator:'管理员'
    })});
  }
}

function deleteOrder(idx){
  var o = getOrderByIdx(idx);
  if(!confirm('确定删除「'+o.wechat+' · '+o.productName+'」？\n此操作不可恢复，将同时删除该订单的配送记录和操作日志。')) return;
  orders = orders.filter(function(x){ return x.idx !== idx; });
  delete orderImages[idx];
  updateStats();
  filterCards();
  showToast('已删除：'+o.wechat+' · '+o.productName);
  if(o.backendId && ZION.delete_order!=='PLACEHOLDER_DELETE'){
    callZion(ZION.delete_order,{order_id:o.backendId}).then(function(r){
      if(r&&r.result==='deleted') console.log('后端删除成功: order_id='+o.backendId);
      else console.error('后端删除失败:',r);
    });
  }
}

function togglePause(idx){
  var o = getOrderByIdx(idx);
  o.paused = !o.paused;
  filterCards();
  showToast(o.wechat + (o.paused ? ' 已暂停配送' : ' 已恢复配送'));
  if(o.backendId){
    var ns = o.paused ? 'paused' : 'active';
    callZion(ZION.update_order,{order_id:o.backendId,update_json:JSON.stringify({status:ns})});
    callZion(ZION.create_adjust_log,{log_json:JSON.stringify({
      order_id:o.backendId,action:o.paused?'pause':'resume',
      old_value:o.paused?'active':'paused',new_value:ns,
      reason:o.paused?'暂停配送':'恢复配送',note:'',image_url:'',operator:'管理员'
    })});
  }
}

function handleImgUpload(input, containerId){
  var container = document.getElementById(containerId);
  var fileList = input.files;
  for(var i=0;i<fileList.length;i++){
    (function(file){
      var wrap = document.createElement('div');
      wrap.className = 'img-preview-item';
      var localUrl = URL.createObjectURL(file);
      wrap.innerHTML = '<img src="'+localUrl+'"><div class="img-del" style="opacity:.4;pointer-events:none">...</div>';
      container.appendChild(wrap);
      uploadImgToOSS(file).then(function(ossUrl){
        wrap.querySelector('img').src = ossUrl;
        wrap.querySelector('.img-del').style.opacity = '';
        wrap.querySelector('.img-del').style.pointerEvents = '';
        wrap.querySelector('.img-del').textContent = '×';
        wrap.querySelector('.img-del').onclick = function(){ wrap.remove(); };
        URL.revokeObjectURL(localUrl);
      }).catch(function(e){
        console.error('OSS upload failed:', e);
        wrap.querySelector('.img-del').textContent = '×';
        wrap.querySelector('.img-del').style.opacity = '';
        wrap.querySelector('.img-del').style.pointerEvents = '';
        wrap.querySelector('.img-del').onclick = function(){ wrap.remove(); };
        showToast(file.name + ' 上传失败');
      });
    })(fileList[i]);
  }
  input.value = '';
}

function openRemarkImg(idx){
  currentRemarkIdx = idx;

function exportExcel(){
  if(!orders.length){ showToast('暂无数据可导出'); return; }
  var header = ['年月','付款平台','支付时间','配送方式','商品分类','商品名称',
    '次数/有效期','原价','折扣','实付金额','下单微信','客户来源','复购标签',
    '包年会员','状态'];
  var maxDel = 0;
  orders.forEach(function(o){ if(o.deliveries.length > maxDel) maxDel = o.deliveries.length; });
  for(var d = 1; d <= maxDel; d++) header.push('第'+d+'次');

  var rows = [header];
  orders.forEach(function(o){
    var statusText = o.paused ? '已暂停' : (getStatusKey(o) === 'done' ? '已完成' : '进行中');
    var row = [o.yearMonth, o.platform, o.payTime, o.deliveryMethod, o.category,
      o.productName, o.totalStr, o.price, o.discount, o.amount, o.wechat,
      o.source, o.repurchase, o.memberType, statusText];
    o.deliveries.forEach(function(dd){ row.push(dd); });
    rows.push(row);
  });

  var ws = XLSX.utils.aoa_to_sheet(rows);
  var colWidths = header.map(function(h,i){
    if(i <= 4) return {wch:10};
    if(i === 5) return {wch:28};
    if(i === 10) return {wch:16};
    return {wch:12};
  });
  ws['!cols'] = colWidths;

  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '会员订单');
  var now = new Date();
  var fname = '咯咯哒后台数据_' + now.getFullYear() +
    ('0'+(now.getMonth()+1)).slice(-2) + ('0'+now.getDate()).slice(-2) +
    ('0'+now.getHours()).slice(-2) + ('0'+now.getMinutes()).slice(-2) + '.xlsx';
  XLSX.writeFile(wb, fname);
  showToast('导出成功：' + fname);
}

function showToast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.remove('show');
  void t.offsetWidth;
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2500);
}

/* ---- 菜品管理 ---- */
var vegPool = [];
var vegEnabled = false;

async function openVegModal(){
  document.getElementById('vegModal').classList.add('show');
  try{
    var vegsRes = await callZion(ZION.list_farm_vegs, {});
    vegPool = JSON.parse(vegsRes.vegs_data || '[]');
  }catch(e){ console.error('load veg data:', e); }
  renderVegList();
}

function renderVegList(){
  var h = '';
  if(!vegPool.length){
    h = '<div style="text-align:center;padding:20px;color:var(--text-3);font-size:13px">暂无菜品，请添加</div>';
  } else {
    vegPool.forEach(function(v){
      h += '<div class="veg-item"><span class="vi-name">'+v.name+'</span>';
      h += '<span class="vi-del" onclick="removeVeg('+v.id+')">删除</span></div>';
    });
  }
  document.getElementById('vegList').innerHTML = h;
}

async function addVeg(){
  var input = document.getElementById('vegNameInput');
  var name = input.value.trim();
  if(!name){ showToast('请输入菜品名称'); return; }
  try{
    var res = await callZion(ZION.add_farm_veg, {veg_name: name});
    if(res && res.veg_id){
      vegPool.push({id: res.veg_id, name: name, status: 'active'});
      renderVegList();
      input.value = '';
      showToast('已添加：' + name);
    }
  }catch(e){ console.error('add veg:', e); showToast('添加失败'); }
}

async function removeVeg(id){
  if(!confirm('确定删除该菜品？')) return;
  try{
    await callZion(ZION.remove_farm_veg, {veg_id: id});
    vegPool = vegPool.filter(function(v){ return v.id !== id; });
    renderVegList();
    showToast('菜品已删除');
  }catch(e){ console.error('remove veg:', e); showToast('删除失败'); }
}

/* ---- 选菜控制（按期） ---- */
var vegCtrlOrderId = null;
var vegCtrlIdx = null;

async function openVegCtrl(idx){
  var o = getOrderByIdx(idx);
  if(!o) return;
  vegCtrlIdx = idx;
  vegCtrlOrderId = o.backendId;
  document.getElementById('vegCtrlTitle').textContent = o.wechat + ' — 选菜控制';
  document.getElementById('vegCtrlModal').classList.add('show');
  if(!vegPool.length){
    try{
      var vegsRes = await callZion(ZION.list_farm_vegs, {});
      vegPool = JSON.parse(vegsRes.vegs_data || '[]');
    }catch(e){}
  }
  renderVegCtrlList(o);
}

function renderVegCtrlList(o){
  var deliveryVegs = o.deliveryVegs || [];
  var total = o.totalNum || 0;
  var h = '';
  for(var p = 1; p <= total; p++){
    var dv = null;
    for(var j = 0; j < deliveryVegs.length; j++){
      if(Number(deliveryVegs[j].period) === p){ dv = deliveryVegs[j]; break; }
    }
    var canSelect = dv ? dv.can_select : false;
    var selVegs = [];
    if(dv && dv.selected_vegs){
      try{ selVegs = JSON.parse(dv.selected_vegs); }catch(e){}
    }
    var selText = selVegs.length ? selVegs.join('、') : '';
    h += '<div class="veg-ctrl-row">';
    h += '<span class="vcr-label">第 '+p+' 期</span>';
    h += '<span class="vcr-vegs">'+(selText||'<span style="color:#ccc">'+(canSelect?'未选菜':'未开放')+'</span>')+'</span>';
    h += '<label class="toggle-sw"><input type="checkbox" '+(canSelect?'checked':'')+' onchange="setDeliveryVeg('+o.backendId+','+p+',this.checked)"><span class="slider"></span></label>';
    h += '</div>';
    if(canSelect){
      h += '<div class="veg-ctrl-detail">';
      h += '<div class="vchk-list" id="vchk-'+p+'">';
      if(!vegPool.length){
        h += '<span style="color:var(--text-3);font-size:13px">暂无菜品，请先在菜品管理里添加</span>';
      } else {
        vegPool.forEach(function(v){
          var ck = selVegs.indexOf(v.name)>=0;
          h += '<div class="vchk-item'+(ck?' checked':'')+'" onclick="toggleVchk(this)" data-name="'+v.name+'">'+v.name+'</div>';
        });
      }
      h += '</div>';
      h += '<button class="btn btn-sm btn-primary" onclick="adminSaveVegSelection('+o.backendId+','+p+')">保存选菜</button>';
      h += '</div>';
    }
  }
  if(!total) h = '<div style="text-align:center;padding:20px;color:var(--text-3)">该订单无配送期数据</div>';
  document.getElementById('vegCtrlList').innerHTML = h;
}

function toggleVchk(el){
  el.classList.toggle('checked');
}

async function adminSaveVegSelection(orderId, period){
  var listEl = document.getElementById('vchk-'+period);
  if(!listEl) return;
  var selected = [];
  listEl.querySelectorAll('.vchk-item.checked').forEach(function(el){ selected.push(el.dataset.name); });
  try{
    var res = await callZion(ZION.save_veg_selection, {order_id: orderId, period: period, vegs_json: JSON.stringify(selected)});
    if(res.result === 'saved'){
      var o = null;
      for(var i=0;i<orders.length;i++) if(orders[i].backendId===orderId){ o=orders[i]; break; }
      if(o){
        if(!o.deliveryVegs) o.deliveryVegs=[];
        var found=false;
        for(var j=0;j<o.deliveryVegs.length;j++){
          if(Number(o.deliveryVegs[j].period)===period){ o.deliveryVegs[j].selected_vegs=JSON.stringify(selected); found=true; break; }
        }
        if(!found) o.deliveryVegs.push({period:period, can_select:true, selected_vegs:JSON.stringify(selected)});
        renderVegCtrlList(o);
      }
      showToast('第 '+period+' 期选菜已保存（'+selected.length+'种）');
    }
  }catch(e){ console.error('admin save veg:', e); showToast('保存失败'); }
}

async function setDeliveryVeg(orderId, period, canSelect){
  try{
    var res = await callZion(ZION.set_delivery_veg, {order_id: orderId, period: period, can_select: canSelect});
    if(res && res.result === 'ok'){
      showToast('第 '+period+' 期 ' + (canSelect ? '已开放选菜' : '已关闭选菜'));
      var o = null;
      for(var i=0;i<orders.length;i++) if(orders[i].backendId===orderId){ o=orders[i]; break; }
      if(o){
        if(!o.deliveryVegs) o.deliveryVegs=[];
        var found=false;
        for(var j=0;j<o.deliveryVegs.length;j++){
          if(Number(o.deliveryVegs[j].period)===period){ o.deliveryVegs[j].can_select=canSelect; found=true; break; }
        }
        if(!found) o.deliveryVegs.push({period:period, can_select:canSelect, selected_vegs:'[]'});
        renderVegCtrlList(o);
      }
    }
  }catch(e){ console.error('set delivery veg:', e); showToast('设置失败'); }
}
