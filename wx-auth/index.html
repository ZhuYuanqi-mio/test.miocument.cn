<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>开启消息通知 - 咯咯哒生态农场</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Helvetica,Arial,sans-serif;background:#f5f7f5;color:#333;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:#fff;border-radius:16px;padding:48px 28px 32px;max-width:420px;width:100%;text-align:center;box-shadow:0 2px 16px rgba(0,0,0,.04)}
.icon{font-size:56px;line-height:1;margin-bottom:20px}
.title{font-size:18px;font-weight:600;color:#1a1a1a;margin-bottom:10px}
.desc{font-size:14px;color:#666;line-height:1.6;margin-bottom:24px}
.btn{display:inline-block;padding:12px 32px;background:#4CAF50;color:#fff;border:none;border-radius:24px;font-size:15px;font-weight:500;cursor:pointer;text-decoration:none}
.btn:active{opacity:.85}
.spinner{display:inline-block;width:32px;height:32px;border:3px solid #e5e5e5;border-top-color:#4CAF50;border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:16px}
@keyframes spin{to{transform:rotate(360deg)}}
.debug{font-size:11px;color:#999;margin-top:20px;word-break:break-all;font-family:monospace}
</style>
</head>
<body>

<div class="card">
  <div id="iconBox" class="icon">⏳</div>
  <div id="titleBox" class="title">正在准备授权…</div>
  <div id="descBox" class="desc">请稍候</div>
  <div id="actionBox" style="display:none;"></div>
  <div id="debugBox" class="debug"></div>
</div>

<script>
// ============ 配置区（部署后按需修改） ============
// 阿里云 FC 部署完成后，把下面的 API_BASE 改成你的 FC 函数访问地址
// 例如: https://miou-auth-xxxxx.cn-hangzhou.fcapp.run
var API_BASE = 'https://REPLACE-WITH-YOUR-FC-URL.cn-hangzhou.fcapp.run';

// 微信服务号 AppID（公开数据，可以放前端）
var WX_APP_ID = 'wxf4fae05959bff2c2';

// 当前页的完整 URL（用作微信 OAuth 的回调地址）
// 注意这里必须是配置在微信公众平台"网页授权域名"白名单下的域名
var REDIRECT_URI = location.origin + location.pathname;

// 授权完成后跳回的业务页（用户端首页 /service/ 或个人中心 /my/）
var SUCCESS_REDIRECT = '/service/';
// =================================================

/** 更新 UI 显示 */
function render(icon, title, desc, actionHtml){
  document.getElementById('iconBox').textContent = icon;
  document.getElementById('titleBox').textContent = title;
  document.getElementById('descBox').textContent = desc;
  var a = document.getElementById('actionBox');
  if(actionHtml){ a.innerHTML = actionHtml; a.style.display = ''; }
  else { a.style.display = 'none'; }
}

/** 显示 loading 状态 */
function renderLoading(title, desc){
  document.getElementById('iconBox').outerHTML = '<div class="spinner" id="iconBox"></div>';
  document.getElementById('titleBox').textContent = title;
  document.getElementById('descBox').textContent = desc;
  document.getElementById('actionBox').style.display = 'none';
}

/** 拼装微信静默授权 URL，带上 user_id 作为 state 传递 */
function buildAuthUrl(userId){
  return 'https://open.weixin.qq.com/connect/oauth2/authorize?' +
    'appid=' + WX_APP_ID +
    '&redirect_uri=' + encodeURIComponent(REDIRECT_URI) +
    '&response_type=code' +
    '&scope=snsapi_base' +
    '&state=' + encodeURIComponent(userId) +
    '#wechat_redirect';
}

/** 把 user_id 和 code 发到后端交换 openid 并写库 */
function bindOpenid(userId, code){
  return fetch(API_BASE + '/wx/bind-by-id', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ user_id: userId, code: code })
  }).then(function(r){ return r.json(); });
}

(function main(){
  var params = new URLSearchParams(location.search);
  var code = params.get('code');
  var state = params.get('state');
  var urlUserId = params.get('user_id');

  // 场景一：用户首次进入本页，URL 只有 ?user_id=xxx，需要跳去微信授权
  if(urlUserId && !code){
    // 环境检查：必须在微信内置浏览器
    if(!/MicroMessenger/i.test(navigator.userAgent)){
      render('📱', '请在微信中打开', '本页面需要在微信客户端内打开，才能完成消息通知授权。',
        '<div style="color:#999;font-size:12px;margin-top:12px;">当前环境不是微信</div>');
      return;
    }
    renderLoading('正在跳转微信授权…', '请稍候');
    location.replace(buildAuthUrl(urlUserId));
    return;
  }

  // 场景二：从微信授权页回跳，URL 带 ?code=xxx&state=user_id
  if(code && state){
    renderLoading('正在开启消息通知…', '正在绑定微信，请稍候');
    bindOpenid(state, code).then(function(res){
      if(res && res.ok){
        render('✓', '开启成功', '已为您开启消息通知，即将跳转…');
        setTimeout(function(){ location.replace(SUCCESS_REDIRECT); }, 1500);
      } else {
        render('✗', '开启失败', (res && res.msg) || '请返回小程序重新点击"开启通知"',
          '<button class="btn" onclick="location.reload()">重试</button>');
      }
    }).catch(function(err){
      render('✗', '网络异常', '无法连接到服务器，请检查网络后重试',
        '<button class="btn" onclick="location.reload()">重试</button>' +
        '<div class="debug">' + (err && err.message || err) + '</div>');
    });
    return;
  }

  // 场景三：参数缺失
  render('⚠️', '参数错误', '链接参数不完整，请从正规入口进入此页面');
})();
</script>

</body>
</html>
