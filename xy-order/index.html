<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>下单 - 咸鱼接单</title>
<script src="https://gosspublic.alicdn.com/aliyun-oss-sdk-6.18.0.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif;background:#f7f7f7;color:#222;min-height:100vh;-webkit-font-smoothing:antialiased}
.container{max-width:500px;margin:0 auto;padding:0 16px 96px}

.top{background:#222;padding:28px 20px 24px;color:#fff;display:flex;justify-content:space-between;align-items:center}
.top-left h1{font-size:18px;font-weight:600;letter-spacing:.3px}
.top-left p{font-size:12px;opacity:.6;margin-top:4px;font-weight:400}
.top-logo{width:52px;height:52px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.15);flex-shrink:0;margin-left:16px}

.section{background:#fff;border-radius:8px;margin:14px 0 0;border:1px solid #e8e8e8}
.section-body{padding:14px 16px 16px}
.form-group{margin-bottom:16px}
.form-group:last-child{margin-bottom:0}
label{font-size:14px;font-weight:500;color:#333;margin-bottom:6px;display:block}
label .req{color:#c00;margin-left:2px}
label .hint{color:#999;font-weight:400;font-size:12px;margin-left:4px}
input[type=text],input[type=datetime-local],textarea{width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:6px;font-size:14px;color:#222;background:#fafafa;outline:none;transition:border-color .2s;font-family:inherit;box-sizing:border-box}
input[type=datetime-local]{-webkit-appearance:none;appearance:none;display:block;height:42px;line-height:20px;min-height:42px}
input[type=datetime-local].empty{color:transparent}
.dl-wrap{position:relative}
.dl-wrap .dl-ph{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:14px;color:#aaa;pointer-events:none;transition:opacity .15s}
.dl-wrap .dl-ph.hide{opacity:0}
input:focus,textarea:focus{border-color:#555}
::placeholder{color:#aaa}
textarea{min-height:90px;resize:vertical;line-height:1.6}

.tags{display:flex;flex-wrap:wrap;gap:8px}
.tags span{padding:7px 15px;border:1px solid #ccc;border-radius:6px;font-size:13px;color:#555;cursor:pointer;transition:all .15s;user-select:none;background:#fafafa}
.tags span.on{border-color:#222;background:#222;color:#fff;font-weight:500}
.tags span.custom{border-style:dashed}
.tags span.custom.on{border-style:solid}
.add-row{display:flex;gap:6px;margin-top:8px}
.add-row input{flex:1;padding:7px 10px;border:1px solid #ddd;border-radius:6px;font-size:13px;outline:none;background:#fafafa}
.add-row input:focus{border-color:#555}
.add-row button{padding:7px 14px;border:1px solid #222;border-radius:6px;background:#222;color:#fff;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}

.upload-area{border:1.5px dashed #ccc;border-radius:8px;padding:20px;text-align:center;cursor:pointer;transition:all .2s;background:#fafafa}
.upload-area:active{background:#f0f0f0;border-color:#999}
.upload-area .ico{font-size:14px;color:#999;margin-bottom:4px}
.upload-area .txt{font-size:13px;color:#666}
.upload-area .sub{font-size:11px;color:#aaa;margin-top:2px}

.img-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.img-item{width:68px;height:68px;border-radius:6px;overflow:hidden;position:relative;border:1px solid #e0e0e0}
.img-item img{width:100%;height:100%;object-fit:cover}
.img-item .x{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:11px;line-height:18px;text-align:center;cursor:pointer}
.img-item.uploading{opacity:.5}
.img-item.uploading::after{content:'...';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.6);font-size:12px;color:#555}

.file-list{margin-top:10px}
.file-row{display:flex;align-items:center;padding:9px 12px;background:#f5f5f5;border-radius:6px;margin-bottom:5px;font-size:13px}
.file-row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#333}
.file-row .sz{color:#999;margin:0 8px;flex-shrink:0;font-size:12px}
.file-row .st{margin:0 6px;flex-shrink:0;font-size:11px;color:#555}
.file-row .rm{color:#c00;cursor:pointer;flex-shrink:0;font-size:12px;font-weight:500}

.bar{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:12px 16px;border-top:1px solid #e0e0e0;z-index:100}
.bar .inner{max-width:500px;margin:0 auto}
.bar button{width:100%;padding:13px;border:none;border-radius:8px;background:#222;color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:opacity .15s;letter-spacing:.5px}
.bar button:active{opacity:.75}
.bar button:disabled{opacity:.35;cursor:not-allowed}

.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(34,34,34,.9);color:#fff;padding:12px 24px;border-radius:8px;font-size:14px;z-index:9999;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}

.done-screen{display:none;position:fixed;inset:0;background:#fff;z-index:200;justify-content:center;align-items:center;flex-direction:column}
.done-screen.show{display:flex}
.done-screen .check{width:52px;height:52px;border-radius:50%;background:#222;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.done-screen .check svg{stroke:#fff;width:26px;height:26px}
.done-screen h2{font-size:18px;font-weight:600;color:#222;margin-bottom:4px}
.done-screen p{font-size:13px;color:#888;margin-bottom:24px}
.done-screen .again{padding:10px 36px;border:1.5px solid #222;border-radius:8px;background:none;color:#222;font-size:14px;font-weight:500;cursor:pointer}
</style>
</head>
<body>

<div class="top">
  <div class="top-left">
    <h1>咸鱼接单 · 提交任务</h1>
    <p>填好信息提交，我尽快给你搞定</p>
  </div>
  <img class="top-logo" src="https://my-video-storage-shihuang.oss-cn-wuhan-lr.aliyuncs.com/xianyu/logo.jpg" alt="">
</div>

<div class="container">
  <div class="section">
    <div class="section-body">
      <div class="form-group">
        <label>咸鱼名称<span class="req">*</span></label>
        <input type="text" id="xyName" placeholder="你的闲鱼昵称">
      </div>
      <div class="form-group">
        <label>邮箱<span class="req">*</span></label>
        <input type="text" id="email" placeholder="做完了我会发邮件给你，咸鱼不方便传文件">
      </div>
      <div class="form-group">
        <label>最迟完成时间<span class="req">*</span></label>
        <div class="dl-wrap">
          <span class="dl-ph" id="dlPh">点击选择日期时间</span>
          <input type="datetime-local" id="deadline" class="empty" onchange="toggleDlPh()" onfocus="toggleDlPh()" onblur="toggleDlPh()">
        </div>
      </div>
      <div class="form-group">
        <label>任务类型<span class="req">*</span><span class="hint">（可多选）</span></label>
        <div class="tags" id="taskTags">
          <span data-v="问卷设计">问卷设计</span>
          <span data-v="答卷设计">答卷设计</span>
          <span data-v="问卷填写">问卷填写</span>
          <span data-v="分析报告">分析报告</span>
          <span data-v="售后修改">售后修改</span>
        </div>
        <div class="add-row">
          <input type="text" id="customTag" placeholder="输入自定义类型">
          <button onclick="addCustomTag()">添加</button>
        </div>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-body">
      <div class="form-group">
        <label>要求描述<span class="req">*</span></label>
        <textarea id="desc" placeholder="写清楚你的需求，比如问卷主题、题目数量、格式要求等"></textarea>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-body">
      <div class="form-group">
        <label>上传图片<span class="hint">（选填）</span></label>
        <div class="upload-area" onclick="document.getElementById('imgInput').click()">
          <div class="ico">[ 图片 ]</div>
          <div class="txt">点击选择图片</div>
          <div class="sub">JPG / PNG，可多选</div>
        </div>
        <input type="file" id="imgInput" accept="image/*" multiple style="display:none" onchange="handleImages(this)">
        <div class="img-list" id="imgList"></div>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-body">
      <div class="form-group">
        <label>上传文件<span class="hint">（选填）</span></label>
        <div class="upload-area" onclick="document.getElementById('fileInput').click()">
          <div class="ico">[ 文件 ]</div>
          <div class="txt">点击选择文件</div>
          <div class="sub">Word / Excel / PDF 等，可多选</div>
        </div>
        <input type="file" id="fileInput" multiple style="display:none" onchange="handleFiles(this)">
        <div class="file-list" id="fileList"></div>
      </div>
    </div>
  </div>
</div>

<div class="bar"><div class="inner">
  <button id="submitBtn" onclick="submitOrder()">提 交</button>
</div></div>

<div class="toast" id="toast"></div>

<div class="done-screen" id="doneScreen">
  <div class="check"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg></div>
  <h2>提交成功</h2>
  <p style="margin-bottom:20px">我会尽快处理你的任务</p>
  <div style="font-size:13px;color:#c00;font-weight:500;margin-bottom:12px">着急请提前2小时加QQ，备注咸鱼名称催促我</div>
  <div style="font-size:18px;font-weight:600;color:#222;letter-spacing:1px;margin-bottom:6px">QQ：3464733548</div>
  <div style="font-size:12px;color:#888;margin-bottom:24px">后续售后也请在QQ找我</div>
  <button class="again" onclick="resetForm()">继续下单</button>
</div>

<script>
var ZION = {
  create_xy_order: 'https://zion-app.functorz.com/zero/mwLZrNj8qJA/callback/b4a14608-e61e-46b6-a748-94be7e205d0d'
};

var ossClient = new OSS({
  region: 'oss-cn-wuhan-lr',
  accessKeyId: 'LTAI5tBcUNsZqv33UggKtQds',
  accessKeySecret: '1pZrU9wXOQW64dqYeGWMBvH0JVC4qs',
  bucket: 'my-video-storage-shihuang'
});
var OSS_BASE = 'https://my-video-storage-shihuang.oss-cn-wuhan-lr.aliyuncs.com/';

var images = [], files = [];

document.getElementById('taskTags').onclick = function(e){
  var s = e.target.closest('span[data-v]');
  if(s) s.classList.toggle('on');
};
function addCustomTag(){
  var inp = document.getElementById('customTag');
  var val = inp.value.trim();
  if(!val){ showToast('请输入类型名称'); return; }
  var exists = document.querySelector('#taskTags span[data-v="'+val+'"]');
  if(exists){ exists.classList.add('on'); inp.value=''; return; }
  var sp = document.createElement('span');
  sp.dataset.v = val;
  sp.textContent = val;
  sp.className = 'on custom';
  document.getElementById('taskTags').appendChild(sp);
  inp.value = '';
}
document.getElementById('customTag').addEventListener('keydown', function(e){
  if(e.key === 'Enter'){ e.preventDefault(); addCustomTag(); }
});
function getTasks(){
  var a=[];
  document.querySelectorAll('#taskTags span.on').forEach(function(s){a.push(s.dataset.v);});
  return a;
}

async function uploadToOSS(file, folder){
  var ext = file.name.split('.').pop();
  var key = 'xianyu/' + folder + '/' + Date.now() + '_' + Math.random().toString(36).slice(2,6) + '.' + ext;
  await ossClient.put(key, file);
  return OSS_BASE + key;
}

function handleImages(inp){
  Array.from(inp.files).forEach(function(f){
    if(!f.type.startsWith('image/')) return;
    var idx = images.length;
    var localUrl = URL.createObjectURL(f);
    images.push({name:f.name, url:'', localPreview:localUrl, uploading:true});
    renderImgs();
    uploadToOSS(f, 'img').then(function(url){
      images[idx].url = url;
      images[idx].uploading = false;
      renderImgs();
    }).catch(function(e){
      console.error('图片上传失败:', e);
      images[idx].uploading = false;
      images[idx].url = 'FAILED';
      renderImgs();
      showToast(f.name + ' 上传失败');
    });
  });
  inp.value='';
}
function renderImgs(){
  var h='';
  images.forEach(function(m,i){
    var cls = m.uploading ? 'img-item uploading' : 'img-item';
    h+='<div class="'+cls+'"><img src="'+m.localPreview+'"><div class="x" onclick="removeImg('+i+')">x</div></div>';
  });
  document.getElementById('imgList').innerHTML=h;
}
function removeImg(i){
  if(images[i].localPreview) URL.revokeObjectURL(images[i].localPreview);
  images.splice(i,1); renderImgs();
}

function fmtSize(b){return b<1024?b+'B':b<1048576?(b/1024).toFixed(1)+'KB':(b/1048576).toFixed(1)+'MB';}
function handleFiles(inp){
  Array.from(inp.files).forEach(function(f){
    var idx = files.length;
    files.push({name:f.name, size:f.size, url:'', uploading:true});
    renderFiles();
    uploadToOSS(f, 'file').then(function(url){
      files[idx].url = url;
      files[idx].uploading = false;
      renderFiles();
    }).catch(function(e){
      console.error('文件上传失败:', e);
      files[idx].uploading = false;
      files[idx].url = 'FAILED';
      renderFiles();
      showToast(f.name + ' 上传失败');
    });
  });
  inp.value='';
}
function renderFiles(){
  var h='';
  files.forEach(function(f,i){
    var status = f.uploading ? '<span class="st">上传中...</span>' : (f.url==='FAILED' ? '<span class="st" style="color:#c00">失败</span>' : '<span class="st" style="color:#444">OK</span>');
    h+='<div class="file-row"><span class="nm">'+f.name+'</span><span class="sz">'+fmtSize(f.size)+'</span>'+status+'<span class="rm" onclick="files.splice('+i+',1);renderFiles()">删除</span></div>';
  });
  document.getElementById('fileList').innerHTML=h;
}

function toggleDlPh(){var dl=document.getElementById('deadline'),v=dl.value;document.getElementById('dlPh').classList.toggle('hide',!!v);dl.classList.toggle('empty',!v);}
function showToast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2500);}

function isAllUploaded(){
  for(var i=0;i<images.length;i++) if(images[i].uploading) return false;
  for(var j=0;j<files.length;j++) if(files[j].uploading) return false;
  return true;
}

function submitOrder(){
  var name=document.getElementById('xyName').value.trim();
  var email=document.getElementById('email').value.trim();
  var dl=document.getElementById('deadline').value;
  var tasks=getTasks();
  var desc=document.getElementById('desc').value.trim();
  if(!name){showToast('请填写咸鱼名称');return;}
  if(!email){showToast('请填写邮箱');return;}
  if(!desc){showToast('请填写要求描述');return;}
  if(!dl){showToast('请选择最迟完成时间');return;}
  if(!tasks.length){showToast('请选择任务类型');return;}
  if(!isAllUploaded()){showToast('文件还在上传中，请稍候');return;}
  var validImgs = images.filter(function(m){return m.url && m.url!=='FAILED';});
  var validFiles = files.filter(function(f){return f.url && f.url!=='FAILED';});
  var btn=document.getElementById('submitBtn');
  btn.disabled=true;btn.textContent='提交中...';
  var payload={order_json:JSON.stringify({
    xianyu_name:name, email:email, deadline:dl+':00+08:00', task_types:tasks.join(','), description:desc,
    image_data:JSON.stringify(validImgs.map(function(m){return{name:m.name,url:m.url};})),
    file_data:JSON.stringify(validFiles.map(function(f){return{name:f.name,size:f.size,url:f.url};})),
    status:'pending'
  })};
  if(ZION.create_xy_order){
    fetch(ZION.create_xy_order,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
    .then(function(r){return r.json();})
    .then(function(){btn.disabled=false;btn.textContent='提 交';document.getElementById('doneScreen').classList.add('show');})
    .catch(function(e){btn.disabled=false;btn.textContent='提 交';showToast('提交失败，请重试');console.error(e);});
  }else{
    setTimeout(function(){btn.disabled=false;btn.textContent='提 交';document.getElementById('doneScreen').classList.add('show');},400);
  }
}
function resetForm(){
  document.getElementById('doneScreen').classList.remove('show');
  document.getElementById('xyName').value='';document.getElementById('email').value='';document.getElementById('deadline').value='';document.getElementById('desc').value='';toggleDlPh();
  document.querySelectorAll('#taskTags span.on').forEach(function(s){s.classList.remove('on');});
  document.querySelectorAll('#taskTags span.custom').forEach(function(s){s.remove();});
  images=[];files=[];
  document.getElementById('imgList').innerHTML='';document.getElementById('fileList').innerHTML='';
  document.getElementById('customTag').value='';
}
</script>
</body>
</html>
