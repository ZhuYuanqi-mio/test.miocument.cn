<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>下单 - 咸鱼接单</title>
<style>
:root{--bg:#f5f5f7;--white:#fff;--primary:#ff6600;--primary-light:#fff3eb;--text-1:#1a1a1a;--text-2:#666;--text-3:#999;--border:#e5e5e5;--radius:12px;--danger:#e74c3c}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Helvetica Neue',sans-serif;background:var(--bg);color:var(--text-1);min-height:100vh}
.container{max-width:480px;margin:0 auto;padding:16px 16px 100px}
.header{text-align:center;padding:24px 0 16px}
.header h1{font-size:20px;font-weight:700;color:var(--text-1)}
.header p{font-size:13px;color:var(--text-3);margin-top:4px}
.card{background:var(--white);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.form-label{font-size:14px;font-weight:600;color:var(--text-1);margin-bottom:8px;display:block}
.form-label .req{color:var(--danger);margin-left:2px}
.form-input{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:8px;font-size:15px;color:var(--text-1);background:var(--white);outline:none;transition:border .2s}
.form-input:focus{border-color:var(--primary)}
.form-input::placeholder{color:var(--text-3)}
textarea.form-input{min-height:100px;resize:vertical;line-height:1.6}
.form-group{margin-bottom:20px}
.form-group:last-child{margin-bottom:0}

.tag-group{display:flex;flex-wrap:wrap;gap:8px}
.tag-option{padding:8px 16px;border:1.5px solid var(--border);border-radius:20px;font-size:13px;color:var(--text-2);cursor:pointer;transition:all .2s;user-select:none}
.tag-option.active{border-color:var(--primary);background:var(--primary-light);color:var(--primary);font-weight:500}

.upload-zone{border:2px dashed var(--border);border-radius:10px;padding:24px;text-align:center;cursor:pointer;transition:all .2s;background:#fafafa}
.upload-zone:hover{border-color:var(--primary);background:var(--primary-light)}
.upload-zone svg{display:block;margin:0 auto 8px}
.upload-zone .label{font-size:14px;color:var(--text-2)}
.upload-zone .hint{font-size:12px;color:var(--text-3);margin-top:4px}

.img-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.img-item{width:72px;height:72px;border-radius:8px;overflow:hidden;position:relative}
.img-item img{width:100%;height:100%;object-fit:cover}
.img-item .del{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:12px;line-height:20px;text-align:center;cursor:pointer}

.file-list{margin-top:10px}
.file-row{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:#f9f9fb;border-radius:8px;margin-bottom:6px;font-size:13px}
.file-row .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-1)}
.file-row .size{color:var(--text-3);margin:0 10px;flex-shrink:0;font-size:12px}
.file-row .del{color:var(--danger);cursor:pointer;flex-shrink:0;font-weight:600}

.submit-bar{position:fixed;bottom:0;left:0;right:0;background:var(--white);padding:12px 16px;box-shadow:0 -2px 10px rgba(0,0,0,.06);z-index:100}
.submit-bar .inner{max-width:480px;margin:0 auto}
.btn-submit{width:100%;padding:14px;border:none;border-radius:10px;background:var(--primary);color:#fff;font-size:16px;font-weight:600;cursor:pointer;transition:opacity .2s}
.btn-submit:active{opacity:.8}
.btn-submit:disabled{opacity:.5;cursor:not-allowed}

.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.78);color:#fff;padding:14px 28px;border-radius:10px;font-size:14px;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}

.success-overlay{display:none;position:fixed;inset:0;background:rgba(255,255,255,.96);z-index:200;justify-content:center;align-items:center;flex-direction:column}
.success-overlay.show{display:flex}
.success-icon{width:64px;height:64px;border-radius:50%;background:#4cd964;display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.success-icon svg{stroke:#fff;width:32px;height:32px}
.success-title{font-size:20px;font-weight:700;color:var(--text-1);margin-bottom:6px}
.success-desc{font-size:14px;color:var(--text-3);margin-bottom:24px}
.btn-again{padding:12px 40px;border:1.5px solid var(--primary);border-radius:10px;background:none;color:var(--primary);font-size:15px;font-weight:600;cursor:pointer}
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>咸鱼接单 · 下单</h1>
    <p>填写任务信息后提交，我会尽快处理</p>
  </div>

  <div class="card">
    <div class="form-group">
      <label class="form-label">咸鱼名称<span class="req">*</span></label>
      <input class="form-input" id="xyName" placeholder="你的闲鱼昵称">
    </div>
    <div class="form-group">
      <label class="form-label">最迟完成时间<span class="req">*</span></label>
      <input class="form-input" type="datetime-local" id="deadline">
    </div>
    <div class="form-group">
      <label class="form-label">任务类型<span class="req">*</span></label>
      <div class="tag-group" id="taskTags">
        <span class="tag-option" data-val="问卷设计">问卷设计</span>
        <span class="tag-option" data-val="答卷设计">答卷设计</span>
        <span class="tag-option" data-val="问卷填写">问卷填写</span>
        <span class="tag-option" data-val="分析报告">分析报告</span>
        <span class="tag-option" data-val="售后修改">售后修改</span>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="form-group">
      <label class="form-label">要求描述</label>
      <textarea class="form-input" id="desc" placeholder="请描述你的需求和具体要求..."></textarea>
    </div>
  </div>

  <div class="card">
    <div class="form-group">
      <label class="form-label">上传图片</label>
      <div class="upload-zone" onclick="document.getElementById('imgInput').click()">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#bbb" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
        <div class="label">点击选择图片</div>
        <div class="hint">支持 JPG/PNG，可多选</div>
      </div>
      <input type="file" id="imgInput" accept="image/*" multiple style="display:none" onchange="handleImages(this)">
      <div class="img-list" id="imgList"></div>
    </div>
  </div>

  <div class="card">
    <div class="form-group">
      <label class="form-label">上传文件</label>
      <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#bbb" stroke-width="1.5"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><polyline points="9 15 12 12 15 15"/></svg>
        <div class="label">点击选择文件</div>
        <div class="hint">支持 Word / Excel / PDF 等，可多选</div>
      </div>
      <input type="file" id="fileInput" multiple style="display:none" onchange="handleFiles(this)">
      <div class="file-list" id="fileList"></div>
    </div>
  </div>
</div>

<div class="submit-bar">
  <div class="inner">
    <button class="btn-submit" id="submitBtn" onclick="submitOrder()">提交订单</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="success-overlay" id="successOverlay">
  <div class="success-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg></div>
  <div class="success-title">提交成功！</div>
  <div class="success-desc">我会尽快处理你的任务</div>
  <button class="btn-again" onclick="resetForm()">继续下单</button>
</div>

<script>
var ZION = {
  create_xy_order: ''
};

var images = [];
var files = [];

document.getElementById('taskTags').addEventListener('click', function(e){
  var tag = e.target.closest('.tag-option');
  if(tag) tag.classList.toggle('active');
});

function getSelectedTasks(){
  var arr = [];
  document.querySelectorAll('#taskTags .tag-option.active').forEach(function(t){ arr.push(t.dataset.val); });
  return arr;
}

function handleImages(input){
  Array.from(input.files).forEach(function(f){
    if(!f.type.startsWith('image/')) return;
    var reader = new FileReader();
    reader.onload = function(e){
      images.push({name:f.name, data:e.target.result});
      renderImages();
    };
    reader.readAsDataURL(f);
  });
  input.value = '';
}
function renderImages(){
  var h = '';
  images.forEach(function(img, i){
    h += '<div class="img-item"><img src="'+img.data+'"><div class="del" onclick="removeImg('+i+')">×</div></div>';
  });
  document.getElementById('imgList').innerHTML = h;
}
function removeImg(i){ images.splice(i,1); renderImages(); }

function formatSize(bytes){
  if(bytes < 1024) return bytes + 'B';
  if(bytes < 1048576) return (bytes/1024).toFixed(1) + 'KB';
  return (bytes/1048576).toFixed(1) + 'MB';
}
function handleFiles(input){
  Array.from(input.files).forEach(function(f){
    var reader = new FileReader();
    reader.onload = function(e){
      files.push({name:f.name, size:f.size, data:e.target.result});
      renderFiles();
    };
    reader.readAsDataURL(f);
  });
  input.value = '';
}
function renderFiles(){
  var h = '';
  files.forEach(function(f, i){
    h += '<div class="file-row"><span class="name">'+f.name+'</span><span class="size">'+formatSize(f.size)+'</span><span class="del" onclick="removeFile('+i+')">删除</span></div>';
  });
  document.getElementById('fileList').innerHTML = h;
}
function removeFile(i){ files.splice(i,1); renderFiles(); }

function showToast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2000);
}

function submitOrder(){
  var name = document.getElementById('xyName').value.trim();
  var deadline = document.getElementById('deadline').value;
  var tasks = getSelectedTasks();
  var desc = document.getElementById('desc').value.trim();

  if(!name){ showToast('请填写咸鱼名称'); return; }
  if(!deadline){ showToast('请选择最迟完成时间'); return; }
  if(!tasks.length){ showToast('请至少选择一个任务类型'); return; }

  var btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = '提交中...';

  var payload = {
    order_json: JSON.stringify({
      xianyu_name: name,
      deadline: deadline + ':00+08:00',
      task_types: tasks.join(','),
      description: desc,
      image_data: JSON.stringify(images.map(function(im){return {name:im.name, data:im.data};})),
      file_data: JSON.stringify(files.map(function(f){return {name:f.name, size:f.size, data:f.data};})),
      status: 'pending'
    })
  };

  if(ZION.create_xy_order){
    fetch(ZION.create_xy_order, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
    .then(function(r){return r.json();})
    .then(function(d){
      btn.disabled = false; btn.textContent = '提交订单';
      document.getElementById('successOverlay').classList.add('show');
    })
    .catch(function(e){
      btn.disabled = false; btn.textContent = '提交订单';
      showToast('提交失败，请重试');
      console.error(e);
    });
  } else {
    var saved = JSON.parse(localStorage.getItem('xy_orders')||'[]');
    saved.push({
      id: Date.now(), xianyu_name: name, deadline: deadline,
      task_types: tasks, description: desc,
      images: images.map(function(im){return {name:im.name, data:im.data};}),
      files: files.map(function(f){return {name:f.name, size:f.size, data:f.data};}),
      status: 'pending', created_at: new Date().toISOString()
    });
    localStorage.setItem('xy_orders', JSON.stringify(saved));
    setTimeout(function(){
      btn.disabled = false; btn.textContent = '提交订单';
      document.getElementById('successOverlay').classList.add('show');
    }, 500);
  }
}

function resetForm(){
  document.getElementById('successOverlay').classList.remove('show');
  document.getElementById('xyName').value = '';
  document.getElementById('deadline').value = '';
  document.getElementById('desc').value = '';
  document.querySelectorAll('#taskTags .tag-option').forEach(function(t){ t.classList.remove('active'); });
  images = []; files = [];
  document.getElementById('imgList').innerHTML = '';
  document.getElementById('fileList').innerHTML = '';
}
</script>
</body>
</html>
