<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>下单 - 咸鱼接单</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif;background:#eef1f6;color:#2c3e50;min-height:100vh;-webkit-font-smoothing:antialiased}
.container{max-width:500px;margin:0 auto;padding:0 16px 96px}

.top{background:linear-gradient(135deg,#3a7bd5,#5b9def);padding:32px 20px 28px;color:#fff;margin-bottom:-12px;position:relative}
.top h1{font-size:19px;font-weight:600;letter-spacing:.5px}
.top p{font-size:13px;opacity:.8;margin-top:5px;font-weight:400}

.section{background:#fff;border-radius:10px;margin:16px 0 0;overflow:hidden;border:1px solid #e2e8f0}
.section-title{padding:14px 16px 0;font-size:13px;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:1px}
.section-body{padding:14px 16px 16px}
.form-group{margin-bottom:16px}
.form-group:last-child{margin-bottom:0}
label{font-size:14px;font-weight:500;color:#334155;margin-bottom:6px;display:block}
label .req{color:#e25555;margin-left:2px}
input[type=text],input[type=datetime-local],textarea{width:100%;padding:10px 12px;border:1px solid #d1d5db;border-radius:6px;font-size:14px;color:#1e293b;background:#fafbfc;outline:none;transition:border-color .2s,box-shadow .2s;font-family:inherit}
input:focus,textarea:focus{border-color:#3a7bd5;box-shadow:0 0 0 3px rgba(58,123,213,.12)}
::placeholder{color:#94a3b8}
textarea{min-height:90px;resize:vertical;line-height:1.6}

.tags{display:flex;flex-wrap:wrap;gap:8px}
.tags span{padding:7px 15px;border:1px solid #cbd5e1;border-radius:6px;font-size:13px;color:#475569;cursor:pointer;transition:all .15s;user-select:none;background:#f8fafc}
.tags span.on{border-color:#3a7bd5;background:#eef4fd;color:#2563eb;font-weight:500}

.upload-area{border:1.5px dashed #c7d2e0;border-radius:8px;padding:20px;text-align:center;cursor:pointer;transition:all .2s;background:#f8fafc}
.upload-area:active{background:#eef4fd;border-color:#3a7bd5}
.upload-area .ico{font-size:24px;margin-bottom:4px;color:#94a3b8}
.upload-area .txt{font-size:13px;color:#64748b}
.upload-area .sub{font-size:11px;color:#94a3b8;margin-top:2px}

.img-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.img-item{width:68px;height:68px;border-radius:6px;overflow:hidden;position:relative;border:1px solid #e2e8f0}
.img-item img{width:100%;height:100%;object-fit:cover}
.img-item .x{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;font-size:11px;line-height:18px;text-align:center;cursor:pointer}

.file-list{margin-top:10px}
.file-row{display:flex;align-items:center;padding:9px 12px;background:#f1f5f9;border-radius:6px;margin-bottom:5px;font-size:13px}
.file-row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#334155}
.file-row .sz{color:#94a3b8;margin:0 8px;flex-shrink:0;font-size:12px}
.file-row .rm{color:#e25555;cursor:pointer;flex-shrink:0;font-size:12px;font-weight:500}

.bar{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:12px 16px;border-top:1px solid #e2e8f0;z-index:100}
.bar .inner{max-width:500px;margin:0 auto}
.bar button{width:100%;padding:13px;border:none;border-radius:8px;background:linear-gradient(135deg,#3a7bd5,#5b9def);color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:opacity .15s;letter-spacing:.5px}
.bar button:active{opacity:.85}
.bar button:disabled{opacity:.45;cursor:not-allowed}

.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(30,41,59,.85);color:#fff;padding:12px 24px;border-radius:8px;font-size:14px;z-index:9999;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}

.done-screen{display:none;position:fixed;inset:0;background:#fff;z-index:200;justify-content:center;align-items:center;flex-direction:column}
.done-screen.show{display:flex}
.done-screen .check{width:56px;height:56px;border-radius:50%;background:#3a7bd5;display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.done-screen .check svg{stroke:#fff;width:28px;height:28px}
.done-screen h2{font-size:18px;font-weight:600;color:#1e293b;margin-bottom:4px}
.done-screen p{font-size:13px;color:#64748b;margin-bottom:24px}
.done-screen .again{padding:10px 36px;border:1.5px solid #3a7bd5;border-radius:8px;background:none;color:#3a7bd5;font-size:14px;font-weight:500;cursor:pointer}
</style>
</head>
<body>

<div class="top">
  <h1>咸鱼接单 · 提交任务</h1>
  <p>填好信息提交，我尽快给你搞定</p>
</div>

<div class="container">
  <div class="section">
    <div class="section-body">
      <div class="form-group">
        <label>咸鱼名称<span class="req">*</span></label>
        <input type="text" id="xyName" placeholder="你的闲鱼昵称">
      </div>
      <div class="form-group">
        <label>最迟完成时间<span class="req">*</span></label>
        <input type="datetime-local" id="deadline">
      </div>
      <div class="form-group">
        <label>任务类型<span class="req">*</span></label>
        <div class="tags" id="taskTags">
          <span data-v="问卷设计">问卷设计</span>
          <span data-v="答卷设计">答卷设计</span>
          <span data-v="问卷填写">问卷填写</span>
          <span data-v="分析报告">分析报告</span>
          <span data-v="售后修改">售后修改</span>
        </div>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-body">
      <div class="form-group">
        <label>要求描述</label>
        <textarea id="desc" placeholder="写清楚你的需求，比如问卷主题、题目数量、格式要求等"></textarea>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-body">
      <div class="form-group">
        <label>上传图片</label>
        <div class="upload-area" onclick="document.getElementById('imgInput').click()">
          <div class="ico">🖼</div>
          <div class="txt">点击选择图片</div>
          <div class="sub">JPG / PNG，可多选</div>
        </div>
        <input type="file" id="imgInput" accept="image/*" multiple style="display:none" onchange="handleImages(this)">
        <div class="img-list" id="imgList"></div>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-body">
      <div class="form-group">
        <label>上传文件</label>
        <div class="upload-area" onclick="document.getElementById('fileInput').click()">
          <div class="ico">📎</div>
          <div class="txt">点击选择文件</div>
          <div class="sub">Word / Excel / PDF 等，可多选</div>
        </div>
        <input type="file" id="fileInput" multiple style="display:none" onchange="handleFiles(this)">
        <div class="file-list" id="fileList"></div>
      </div>
    </div>
  </div>
</div>

<div class="bar"><div class="inner">
  <button id="submitBtn" onclick="submitOrder()">提 交</button>
</div></div>

<div class="toast" id="toast"></div>

<div class="done-screen" id="doneScreen">
  <div class="check"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg></div>
  <h2>提交成功</h2>
  <p>我会尽快处理你的任务</p>
  <button class="again" onclick="resetForm()">继续下单</button>
</div>

<script>
var ZION = {
  create_xy_order: 'https://zion-app.functorz.com/zero/mwLZrNj8qJA/callback/b4a14608-e61e-46b6-a748-94be7e205d0d'
};
var images = [], files = [];

document.getElementById('taskTags').onclick = function(e){
  var s = e.target.closest('span[data-v]');
  if(s) s.classList.toggle('on');
};
function getTasks(){
  var a=[];
  document.querySelectorAll('#taskTags span.on').forEach(function(s){a.push(s.dataset.v);});
  return a;
}

function handleImages(inp){
  Array.from(inp.files).forEach(function(f){
    if(!f.type.startsWith('image/'))return;
    var r=new FileReader();
    r.onload=function(e){images.push({name:f.name,data:e.target.result});renderImgs();};
    r.readAsDataURL(f);
  }); inp.value='';
}
function renderImgs(){
  var h='';
  images.forEach(function(m,i){h+='<div class="img-item"><img src="'+m.data+'"><div class="x" onclick="images.splice('+i+',1);renderImgs()">×</div></div>';});
  document.getElementById('imgList').innerHTML=h;
}

function fmtSize(b){return b<1024?b+'B':b<1048576?(b/1024).toFixed(1)+'KB':(b/1048576).toFixed(1)+'MB';}
function handleFiles(inp){
  Array.from(inp.files).forEach(function(f){
    var r=new FileReader();
    r.onload=function(e){files.push({name:f.name,size:f.size,data:e.target.result});renderFiles();};
    r.readAsDataURL(f);
  }); inp.value='';
}
function renderFiles(){
  var h='';
  files.forEach(function(f,i){h+='<div class="file-row"><span class="nm">'+f.name+'</span><span class="sz">'+fmtSize(f.size)+'</span><span class="rm" onclick="files.splice('+i+',1);renderFiles()">删除</span></div>';});
  document.getElementById('fileList').innerHTML=h;
}

function showToast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2000);}

function submitOrder(){
  var name=document.getElementById('xyName').value.trim();
  var dl=document.getElementById('deadline').value;
  var tasks=getTasks();
  var desc=document.getElementById('desc').value.trim();
  if(!name){showToast('请填写咸鱼名称');return;}
  if(!dl){showToast('请选择最迟完成时间');return;}
  if(!tasks.length){showToast('请选择任务类型');return;}
  var btn=document.getElementById('submitBtn');
  btn.disabled=true;btn.textContent='提交中...';
  var payload={order_json:JSON.stringify({
    xianyu_name:name,deadline:dl+':00+08:00',task_types:tasks.join(','),description:desc,
    image_data:JSON.stringify(images.map(function(m){return{name:m.name,data:m.data};})),
    file_data:JSON.stringify(files.map(function(f){return{name:f.name,size:f.size,data:f.data};})),
    status:'pending'
  })};
  if(ZION.create_xy_order){
    fetch(ZION.create_xy_order,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
    .then(function(r){return r.json();})
    .then(function(){btn.disabled=false;btn.textContent='提 交';document.getElementById('doneScreen').classList.add('show');})
    .catch(function(e){btn.disabled=false;btn.textContent='提 交';showToast('提交失败，请重试');console.error(e);});
  }else{
    var saved=JSON.parse(localStorage.getItem('xy_orders')||'[]');
    saved.push({id:Date.now(),xianyu_name:name,deadline:dl,task_types:tasks,description:desc,images:images.slice(),files:files.slice(),status:'pending',created_at:new Date().toISOString()});
    localStorage.setItem('xy_orders',JSON.stringify(saved));
    setTimeout(function(){btn.disabled=false;btn.textContent='提 交';document.getElementById('doneScreen').classList.add('show');},400);
  }
}
function resetForm(){
  document.getElementById('doneScreen').classList.remove('show');
  document.getElementById('xyName').value='';document.getElementById('deadline').value='';document.getElementById('desc').value='';
  document.querySelectorAll('#taskTags span').forEach(function(s){s.classList.remove('on');});
  images=[];files=[];document.getElementById('imgList').innerHTML='';document.getElementById('fileList').innerHTML='';
}
</script>
</body>
</html>
